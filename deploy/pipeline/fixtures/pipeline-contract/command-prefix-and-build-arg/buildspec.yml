version: 0.2
env:
  shell: bash
  exported-variables:
    - DEPLOY_PREAPPROVED
phases:
  build:
    commands:
      - "echo region $AWS_REGION_HUB bucket ${ARTIFACT_BUCKET} repo ${ECR_REPO:-}"
      - |
        DEPLOY_PREAPPROVED=0
        export DEPLOY_PREAPPROVED
      - |
        PFX_A=1 PFX_B="$AWS_REGION_HUB" node x.js
        docker build --build-arg UNDECL_BA="${UNDECL_BA:-}" .
