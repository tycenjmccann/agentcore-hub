version: 0.2
env:
  shell: bash
  exported-variables:
    - DEPLOY_PREAPPROVED
phases:
  build:
    commands:
      - "echo region $AWS_REGION_HUB bucket ${ARTIFACT_BUCKET} repo ${ECR_REPO:-}"
      - |
        DEPLOY_PREAPPROVED=0
        export DEPLOY_PREAPPROVED
      - |
        X_VAR=1
        X_VAR="$(printf %s "$X_VAR" | cut -c1-12)"
