version: 0.2
env:
  shell: bash
  exported-variables:
    - DEPLOY_PREAPPROVED
phases:
  build:
    commands:
      - "echo region $AWS_REGION_HUB bucket ${ARTIFACT_BUCKET} repo ${ECR_REPO:-}"
      - |
        DEPLOY_PREAPPROVED=0
        export DEPLOY_PREAPPROVED
      - |
        GIT_SHA=abc
        GIT_SHA="$GIT_SHA" EVENTS_TABLE="${EVENTS_TABLE:-agentcore-hub-events}" \
          python3 deploy.py
