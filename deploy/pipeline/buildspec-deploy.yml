# buildspec-deploy.yml — the Deploy stage. The machine form of DEPLOY.md's
# three app targets PLUS every code-only surface in deploy/pipeline/surfaces.json
# (the other Lambdas, harness prompt/model/skills, S3 toolkits), run under the
# pipeline's NARROW IAM role (no laptop, no tycenj-prod profile, Jira creds never
# touched — the role literally cannot UpdateFunctionConfiguration). Consumes the
# Build stage's artifacts by digest; it never rebuilds. See
# docs/cicd-pipeline-module-design.md.
#
# Which surfaces deploy is decided by deploy/pipeline/plan-surfaces.py from the
# Build stage's changed-files.txt — code pushes only. Infra scripts (IAM, env,
# tables, runtime images) are HANDOFF: the app + surfaces ship, the baseline
# advances, then the action exits 2 so the release manager reports the human
# step. Before the manifest existed the pipeline shipped 3 of ~14 surfaces and
# everything else drifted behind main for days (audit 2026-09-04).
#
# The entire deploy runs inside ONE build-phase block with a bash `trap` so that
# ANY failure — orchestrator update, S3 merge, ECS roll, eval targets, OR a
# post-deploy smoke check — triggers rollback (Codex PR #263 round-3). The
# rollback snapshot of orchestrator-current.zip is only advanced AFTER full
# success, so a failed deploy never poisons the next run's rollback source.
#
# NOTE: commands are QUOTED YAML scalars; unquoted "echo foo: bar" parses as a
# mapping and CodeBuild rejects it (Codex #263 round-3).
version: 0.2

# CodeBuild defaults Linux command execution to /bin/sh (dash). The deploy block
# opens with `set -euo pipefail` and uses bash here-strings (`read <<<`), both of
# which dash rejects — the first line aborts before Target 1 and NOTHING deploys
# (pilot runs 2cc3f811 / bd4a5888: "set: Illegal option -o pipefail"). The shell
# selector is a FIELD OF env: in buildspec 0.2, not a top-level key — a top-level
# `shell:` is silently ignored and the block still runs under dash.
env:
  shell: bash

phases:
  pre_build:
    commands:
      - "ACCOUNT_ID=\"$(aws sts get-caller-identity --query Account --output text)\""
      # Account guard — mirror deploy/config.sh: refuse a wrong account.
      - |
        if [ -n "${EXPECTED_ACCOUNT_ID:-}" ] && [ "$ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]; then
          echo "ERROR: account $ACCOUNT_ID != EXPECTED_ACCOUNT_ID $EXPECTED_ACCOUNT_ID" >&2; exit 1
        fi
      # ── Deploy plan (DETECT only, don't exit): plan-surfaces.py maps the
      # changed files onto the surface manifest — which Lambdas / S3 toolkits /
      # harnesses to update, and which files are infra-only HANDOFF (runtime
      # images, IAM/env scripts). We do NOT exit on a handoff here — that would
      # wedge the pipeline, because the baseline SHA only advances after a
      # successful app deploy, so the same range would re-block forever (Codex PR
      # #263 round-5). Instead we DEPLOY EVERYTHING WE CAN, advance the baseline,
      # and THEN signal the handoff as a terminal non-rollback failure.
      - |
        python3 deploy/pipeline/plan-surfaces.py pipeline-out/changed-files.txt > /tmp/deploy-plan.tsv
        echo "── deploy plan ──"; cut -f1-3 /tmp/deploy-plan.tsv || true
        # Hand the handoff signal to the build phase (env doesn't persist across
        # CodeBuild phase boundaries; write it to a file the build block reads).
        if grep -q '^HANDOFF' /tmp/deploy-plan.tsv; then printf 1 > /tmp/eval-handoff; else printf 0 > /tmp/eval-handoff; fi
        grep '^HANDOFF' /tmp/deploy-plan.tsv | cut -f2 > /tmp/eval-files || true

  build:
    commands:
      - |
        set -euo pipefail
        export AWS_REGION_HUB ACCOUNT_ID ARTIFACT_BUCKET ECR_REPO ECS_SERVICE_ARN

        IMAGE_DIGEST="$(cat pipeline-out/image-digest.txt)"
        GIT_SHA="$(cat pipeline-out/git-sha.txt)"
        ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION_HUB}.amazonaws.com/${ECR_REPO}"
        # Guard: a blank/malformed digest yields a "${ECR_URI}@" ref that ECS
        # rejects mid-deploy ("Container.image is incomplete"). Refuse BEFORE
        # touching prod so nothing needs rolling back (the Build stage should
        # never emit this, but defend the irreversible step anyway).
        case "$IMAGE_DIGEST" in
          sha256:*) : ;;
          *) echo "FATAL: image-digest.txt is not a sha256 digest ('$IMAGE_DIGEST') — refusing to deploy" >&2; exit 1 ;;
        esac
        echo "Promoting image ${ECR_URI}@${IMAGE_DIGEST} (built from ${GIT_SHA})"

        # ── Snapshot CURRENT prod for rollback BEFORE touching anything ──
        # DEPLOY.md manual rollback = re-point Lambda at prior zip + ECS at prior
        # image. rollback.sh restores from these; run on ANY failure via trap.
        mkdir -p /tmp/rollback
        if aws s3api get-object --bucket "$ARTIFACT_BUCKET" --key "pipeline-artifacts/orchestrator-current.zip" \
             /tmp/rollback/orchestrator-prev.zip --region "$AWS_REGION_HUB" >/dev/null 2>&1; then
          echo "captured prior orchestrator zip from snapshot"
        else
          # FIRST pipeline run: no snapshot yet, but a prod orchestrator already
          # exists. Seed the rollback source from the LIVE Lambda code so a failed
          # first deploy can still restore pre-pipeline code (Codex #263 round-4 P1).
          echo "no prior snapshot — seeding rollback from LIVE orchestrator code"
          LIVE_URL="$(aws lambda get-function --function-name agentcore-hub-orchestrator \
            --region "$AWS_REGION_HUB" --query 'Code.Location' --output text 2>/dev/null || true)"
          if [ -n "$LIVE_URL" ] && [ "$LIVE_URL" != "None" ]; then
            curl -sf "$LIVE_URL" -o /tmp/rollback/orchestrator-prev.zip && echo "seeded rollback from live Lambda" \
              || echo "WARN: could not download live Lambda code — rollback of orchestrator unavailable this run"
          else
            echo "WARN: no live orchestrator to seed from — rollback of orchestrator unavailable this run"
          fi
        fi
        if [ -n "${ECS_SERVICE_ARN:-}" ]; then
          aws ecs describe-express-gateway-service --service-arn "$ECS_SERVICE_ARN" --region "$AWS_REGION_HUB" --output json 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); pc=(d.get('service',{}).get('activeConfigurations') or [{}])[0].get('primaryContainer',{}); print(pc.get('image',''))" \
            > /tmp/rollback/ecs-prev-image.txt 2>/dev/null || true
          echo "captured prior ECS image: $(cat /tmp/rollback/ecs-prev-image.txt 2>/dev/null)"
        fi

        # Roll back on ANY failure from here on (deploy target OR smoke check).
        trap 'rc=$?; if [ $rc -ne 0 ]; then echo "── deploy failed (rc=$rc) → rolling back ──"; bash deploy/pipeline/rollback.sh || echo "rollback errored — inspect"; fi; exit $rc' EXIT

        # ── Target 1: orchestrator Lambdas — CODE ONLY (prebuilt zip) ──
        # lambda/orchestrator/deploy.sh ships ONE zip to THREE functions
        # (orchestrator + agent-invoker + events-writer share the source dir and
        # the manifest). The pipeline must do the same: updating only the
        # orchestrator left agent-invoker on 2026-08-27 code for a week while
        # main carried the retry/liveness/lease fixes (drift audit 2026-09-04).
        # update-function-code echoes the FULL function config, incl. plaintext
        # env vars (JIRA_API_TOKEN, GITHUB_PAT) → CloudWatch. Suppress stdout so
        # those secrets never land in the build log (pilot run b6cdd247 leaked
        # them). --output text --query keeps only the state we assert on.
        echo "Target 1/3 orchestrator Lambdas code-only (orchestrator, agent-invoker, events-writer)"
        for FN in agentcore-hub-orchestrator agentcore-hub-agent-invoker agentcore-hub-events-writer; do
          aws lambda update-function-code --function-name "$FN" \
            --zip-file fileb://pipeline-out/orchestrator.zip --region "$AWS_REGION_HUB" \
            --output text --query 'LastUpdateStatus' >/dev/null
          aws lambda wait function-updated --function-name "$FN" --region "$AWS_REGION_HUB"
        done

        # ── Target 1b: every other Lambda in the surface manifest — CODE ONLY ──
        # plan-surfaces.py emitted one LAMBDA row per function whose source dir
        # changed. Each row: function, dir, npm(0|1), optional(0|1), zip file
        # list (mirrors that Lambda's own deploy.sh zip line), note. Live code is
        # snapshotted first so rollback.sh can restore it. Env/IAM are never
        # touched (that stays with each surface's deploy.sh — a HANDOFF row).
        # Loops read the plan on fd 3: npm/aws inside the loop must not eat the
        # plan from stdin.
        echo "Target 1b surface Lambdas (manifest-driven, code-only)"
        mkdir -p /tmp/rollback/lambda
        while IFS=$'\t' read -r KIND FN DIR NPM OPTIONAL FILES NOTE <&3; do
          [ "$KIND" = "LAMBDA" ] || continue
          if ! aws lambda get-function-configuration --function-name "$FN" --region "$AWS_REGION_HUB" >/dev/null 2>&1; then
            if [ "$OPTIONAL" = "1" ]; then echo "  $FN not present in this account — skipped (optional surface)"; continue; fi
            echo "FATAL: $FN does not exist — create it once with its own deploy script, then the pipeline keeps its code current" >&2
            exit 1
          fi
          LIVE_URL="$(aws lambda get-function --function-name "$FN" --region "$AWS_REGION_HUB" --query 'Code.Location' --output text 2>/dev/null || true)"
          if [ -n "$LIVE_URL" ] && [ "$LIVE_URL" != "None" ] && curl -sf "$LIVE_URL" -o "/tmp/rollback/lambda/$FN.zip"; then
            echo "  $FN: rollback snapshot captured"
          else
            rm -f "/tmp/rollback/lambda/$FN.zip"; echo "  WARN: $FN: no rollback snapshot (live code not downloadable)"
          fi
          rm -f /tmp/surface.zip
          ( cd "$DIR" \
            && if [ "$NPM" = "1" ]; then rm -rf node_modules; npm ci --omit=dev --no-audit --no-fund --silent || npm install --omit=dev --no-audit --no-fund --silent; fi \
            && zip -rq /tmp/surface.zip $FILES )
          # --output text --query: update-function-code echoes the full config incl.
          # plaintext env vars (tokens) — keep them out of the build log.
          aws lambda update-function-code --function-name "$FN" \
            --zip-file fileb:///tmp/surface.zip --region "$AWS_REGION_HUB" \
            --output text --query 'LastUpdateStatus' >/dev/null
          aws lambda wait function-updated --function-name "$FN" --region "$AWS_REGION_HUB"
          echo "  $FN updated ($(du -k /tmp/surface.zip | cut -f1) KB)"
          [ -n "$NOTE" ] && echo "  NOTE for $FN: $NOTE" || true
        done 3< /tmp/deploy-plan.tsv

        # ── Target 2: config/blueprints → S3 (agents.json MERGED, never cp'd) ──
        echo "Target 2/3 config + blueprints to S3"
        aws s3 sync blueprints/ "s3://$ARTIFACT_BUCKET/blueprints/"
        aws s3 sync deploy/runtime-agent/prompts/ "s3://$ARTIFACT_BUCKET/prompts/" || true
        aws s3 cp src/config/workflows.json "s3://$ARTIFACT_BUCKET/config/workflows.json"
        aws s3 cp "s3://$ARTIFACT_BUCKET/config/agents.json" /tmp/agents-s3.json
        python3 deploy/pipeline/merge-agents-json.py /tmp/agents-s3.json src/config/agents.json /tmp/agents-merged.json
        aws s3 cp /tmp/agents-merged.json "s3://$ARTIFACT_BUCKET/config/agents.json"
        # Manifest S3 surfaces (WM toolkit/skills, routine-builder toolkit,
        # pricing.json). Extra args are the same --delete/--exclude each surface's
        # deploy.sh uses; set -f keeps the exclude glob literal.
        while IFS=$'\t' read -r KIND SRC DST EXTRA <&3; do
          case "$KIND" in
            S3SYNC) set -f; aws s3 sync "$SRC" "s3://$ARTIFACT_BUCKET/$DST" $EXTRA --only-show-errors; set +f; echo "  synced $SRC → $DST" ;;
            S3CP)   aws s3 cp "$SRC" "s3://$ARTIFACT_BUCKET/$DST" --only-show-errors; echo "  copied $SRC → $DST" ;;
          esac
        done 3< /tmp/deploy-plan.tsv

        # ── Target 2b: harness prompt / model / skills (WM, builder, routine builder) ──
        # Runs each harness's OWN setup script in PIPELINE_MODE (no IAM, no memory
        # provisioning, no verify invoke — UpdateHarness on the existing harness
        # only, after snapshotting the live prompt/model for rollback.sh). S3
        # skills above land first because the WM harness references them by URI.
        if grep -q '^HARNESS' /tmp/deploy-plan.tsv; then
          echo "Target 2b harness updates"
          # The setup scripts import the repo's AWS SDK clients. Install just
          # those three, at the versions root package.json pins, into a scratch
          # dir and symlink it as ./node_modules — ESM resolution from
          # deploy/**/*.mjs walks up to the repo root, and a full `npm ci` of the
          # Next app here would add minutes for nothing.
          PKGS="$(node -e 'const d=require("./package.json").dependencies;for(const n of ["@aws-sdk/client-bedrock-agentcore-control","@aws-sdk/client-sts","@aws-sdk/client-iam"]){if(!d[n])throw new Error(n+" missing from package.json");console.log(n+"@"+d[n])}' | tr '\n' ' ')"
          mkdir -p /tmp/hdeps && ( cd /tmp/hdeps && [ -f package.json ] || npm init -y >/dev/null; npm install --no-audit --no-fund --silent $PKGS )
          [ -e node_modules ] || ln -s /tmp/hdeps/node_modules node_modules
          mkdir -p /tmp/rollback/harness
          while IFS=$'\t' read -r KIND HNAME HSCRIPT <&3; do
            [ "$KIND" = "HARNESS" ] || continue
            echo "  $HNAME ← $HSCRIPT"
            PIPELINE_MODE=1 HARNESS_SNAPSHOT_DIR=/tmp/rollback/harness AWS_REGION="$AWS_REGION_HUB" ARTIFACT_BUCKET="$ARTIFACT_BUCKET" \
              node "$HSCRIPT" < /dev/null
          done 3< /tmp/deploy-plan.tsv
        fi

        # ── Target 3: ECS Express app — roll to the promoted image BY DIGEST ──
        echo "Target 3/3 ECS Express roll-by-digest"
        if [ -n "${ECS_SERVICE_ARN:-}" ]; then
          DESC="$(aws ecs describe-express-gateway-service --service-arn "$ECS_SERVICE_ARN" --region "$AWS_REGION_HUB" --output json)"
          # Fail-closed: the helper exits non-zero on no live container, and VAR="$(cmd)"
          # propagates that status, so set -euo pipefail aborts here and fires the rollback trap.
          PRIMARY="$(python3 deploy/pipeline/ecs-primary-container.py "$DESC" "${ECR_URI}@${IMAGE_DIGEST}")"
          aws ecs update-express-gateway-service --service-arn "$ECS_SERVICE_ARN" \
            --region "$AWS_REGION_HUB" --primary-container "$PRIMARY" --output text >/dev/null
          echo "ECS roll started to ${ECR_URI}@${IMAGE_DIGEST}"
        else
          echo "ECS_SERVICE_ARN unset — skipping app roll (Lambda/blueprint-only deploy)"
        fi

        # (HANDOFF rows from the plan are reported AFTER a successful deploy +
        # baseline advance — see the handoff signal below — so everything that
        # can ship does, and the same commits never re-block.)

        # ── Smoke checks (DEPLOY.md) — failures here also hit the rollback trap ──
        echo "Smoke checks"
        aws lambda invoke --function-name agentcore-hub-orchestrator \
          --payload "$(printf '{}' | base64)" --region "$AWS_REGION_HUB" /tmp/o.json >/tmp/o.meta 2>&1
        if grep -q '"FunctionError"' /tmp/o.meta; then echo "ORCHESTRATOR INIT SMOKE FAILED"; cat /tmp/o.meta; exit 1; fi
        echo "orchestrator invoke OK (no FunctionError)"
        aws s3 cp "s3://$ARTIFACT_BUCKET/config/agents.json" - | python3 -c "import json,sys; a=json.load(sys.stdin); assert all(x.get('runtimeArn') for x in a['agents'] if x.get('type')=='runtime'), 'null runtimeArn — merge clobbered ARNs'; print('config ok')"
        if [ -n "${ECS_SERVICE_ARN:-}" ]; then
          echo "Verifying ECS rollout health"
          URL=""
          for i in $(seq 1 60); do
            DESC="$(aws ecs describe-express-gateway-service --service-arn "$ECS_SERVICE_ARN" --region "$AWS_REGION_HUB" --output json 2>/dev/null || echo '{}')"
            read -r STATUS URL <<<"$(python3 deploy/pipeline/ecs-health.py "$DESC")"
            if [ "$STATUS" = "ACTIVE" ] && [ -n "$URL" ]; then break; fi
            sleep 10
            if [ "$i" = "60" ]; then echo "ECS did not reach ACTIVE with an endpoint"; exit 1; fi
          done
          case "$URL" in http*) : ;; *) URL="https://$URL" ;; esac
          echo "service ACTIVE at $URL — checking app health"
          curl -sf "$URL/api/agentcore/traces/health" >/dev/null || { echo "app health check FAILED"; exit 1; }
          echo "ECS rollout healthy"
        fi

        # ── APP DEPLOY SUCCEEDED: advance the rollback snapshot + baseline NOW ──
        # (Codex #263 round-3 P2: never label a failed deploy "current". Round-5:
        # the baseline advances on EVERY successful app deploy — including one that
        # also carried eval files — so the eval handoff below never re-blocks the
        # same commits.)
        aws s3 cp pipeline-out/orchestrator.zip "s3://$ARTIFACT_BUCKET/pipeline-artifacts/orchestrator-current.zip" --region "$AWS_REGION_HUB"
        printf '%s' "$GIT_SHA" | aws s3 cp - "s3://$ARTIFACT_BUCKET/pipeline-artifacts/last-deployed-sha.txt" --region "$AWS_REGION_HUB"
        trap - EXIT
        echo "── App deploy complete ──"

        # ── Infra/runtime handoff: everything deployable shipped + baseline
        # advanced; NOW fail the action (no rollback — the deploy is good and
        # permanent) so the release manager reports the remaining files as a
        # human step. Because the baseline already moved to this SHA, the NEXT
        # run starts from here and will NOT re-block these commits (Codex #263
        # round-5). What lands here: runtime images (deploy/runtime-agent,
        # deploy/coding-agent-runtime) and infra scripts (IAM/env/tables) — see
        # surfaces.json "handoff". Code-only surfaces are NOT here anymore.
        if [ "$(cat /tmp/eval-handoff 2>/dev/null)" = "1" ]; then
          echo "── HANDOFF: app + code surfaces deployed OK, but the changeset also touched infra-only files ──" >&2
          echo "The pipeline deploys code (Lambda zips, harness prompts/models, S3 toolkits) — not" >&2
          echo "runtime images, IAM, env vars or tables. A human must run the owning script for:" >&2
          sed 's/^/  - /' /tmp/eval-files >&2
          echo "(DEPLOY.md 'Not covered by the app pipeline' maps each path to its command.)" >&2
          echo "Everything else is deployed + verified and the baseline has advanced, so" >&2
          echo "re-running will not re-block these commits." >&2
          exit 2
        fi
