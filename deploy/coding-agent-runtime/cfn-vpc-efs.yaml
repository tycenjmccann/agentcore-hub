AWSTemplateFormatVersion: "2010-09-09"
Description: VPC + EFS for the AgentCore Hub coding runtime (persistent code workspace)

# Why EFS (not the default sessionStorage): a git working tree + node_modules
# blows past the ~1 GB session-storage quota (ENOSPC). EFS is elastic, POSIX,
# and persists across cold microVMs — the right store for a live coding
# workspace. Mirrors awslabs/agentcore-samples 04-coding-agents/02-claude-code-with-efs.

Parameters:
  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"

Mappings:
  AgentCoreAZs:
    us-east-1: { AZ1: use1-az1, AZ2: use1-az2 }
    us-east-2: { AZ1: use2-az1, AZ2: use2-az2 }
    us-west-2: { AZ1: usw2-az1, AZ2: usw2-az2 }

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: agentcore-hub-coding-vpc }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: agentcore-hub-coding-igw }]

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZoneId: !FindInMap [AgentCoreAZs, !Ref "AWS::Region", AZ1]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: agentcore-hub-coding-public-1 }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZoneId: !FindInMap [AgentCoreAZs, !Ref "AWS::Region", AZ2]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: agentcore-hub-coding-public-2 }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.11.0/24"
      AvailabilityZoneId: !FindInMap [AgentCoreAZs, !Ref "AWS::Region", AZ1]
      Tags: [{ Key: Name, Value: agentcore-hub-coding-private-1 }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.12.0/24"
      AvailabilityZoneId: !FindInMap [AgentCoreAZs, !Ref "AWS::Region", AZ2]
      Tags: [{ Key: Name, Value: agentcore-hub-coding-private-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: agentcore-hub-coding-public-rt }]

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }

  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }

  NatEIP:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags: [{ Key: Name, Value: agentcore-hub-coding-nat }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: agentcore-hub-coding-private-rt }]

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRouteTable }

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRouteTable }

  AgentCoreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the AgentCore Hub coding runtime
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: "10.0.0.0/16"
          Description: Allow NFS (EFS mount) from within the VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: Allow all outbound (Bedrock, GitHub, npm, etc.)
      Tags: [{ Key: Name, Value: agentcore-hub-coding-sg }]

  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags: [{ Key: Name, Value: agentcore-hub-coding-efs }]

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups: [!Ref AgentCoreSecurityGroup]

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups: [!Ref AgentCoreSecurityGroup]

  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser: { Uid: "1000", Gid: "1000" }
      RootDirectory:
        Path: /workspace
        CreationInfo: { OwnerUid: "1000", OwnerGid: "1000", Permissions: "755" }
      AccessPointTags: [{ Key: Name, Value: agentcore-hub-coding-ap }]

Outputs:
  VpcId: { Value: !Ref VPC }
  PrivateSubnet1Id: { Value: !Ref PrivateSubnet1 }
  PrivateSubnet2Id: { Value: !Ref PrivateSubnet2 }
  SecurityGroupId: { Value: !Ref AgentCoreSecurityGroup }
  EFSFileSystemId: { Value: !Ref EFSFileSystem }
  EFSAccessPointArn: { Value: !GetAtt EFSAccessPoint.Arn }
