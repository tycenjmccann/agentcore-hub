AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AgentCore Hub Orchestrator — Event-driven workflow engine via DynamoDB Streams.
  Replaces the in-process Next.js orchestration with Lambda + Streams.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 900  # 15 min max for long agent invocations
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION_OVERRIDE: !Ref AWS::Region
        TICKETS_TABLE: !Ref TicketsTableName
        WORKFLOWS_TABLE: !Ref WorkflowsTableName
        EVENTS_TABLE: !Ref EventsTableName
        ARTIFACT_BUCKET: !Ref ArtifactBucket
        GITHUB_LAMBDA: !Ref GitHubLambdaName
        EVENT_BUS: !Ref EventBus
        PROJECT_KEY: TEAM
        DEAD_SESSION_DETECTOR_MODE: !Ref DeadSessionDetectorMode
        CASCADE_EXTENDED_STATES: !Ref CascadeExtendedStates
        RECONCILE_SWEEP_MODE: !Ref ReconcileSweepMode
        # Globals reaches all three writers (orchestrator, agent-invoker,
        # events-writer) in one place, which is exactly the requirement: the
        # double-write only collapses when all three agree on the mode.
        EVENT_DEDUPE_MODE: !Ref EventDedupeMode
        # Only the orchestrator reads this (it is the sole writer/reader of
        # gateStates); it rides Globals for one-place-to-set parity with the
        # other mode flags and is inert in the other two functions. deploy.sh
        # forwards it to the orchestrator only.
        GATE_STATE_GUARD: !Ref GateStateGuard
        # Orchestrator-only as well (both exhausted-retry emitters live there);
        # rides Globals for the same one-place-to-set parity.
        DEAD_SESSION_ESCALATION_MODE: !Ref DeadSessionEscalationMode

Parameters:
  TicketsTableName:
    Type: String
    Default: agentcore-hub-tickets
    Description: Existing DynamoDB table for tickets (must have Streams enabled)

  WorkflowsTableName:
    Type: String
    Default: agentcore-hub-workflows
    Description: Existing DynamoDB table for workflow metadata

  EventsTableName:
    Type: String
    Default: agentcore-hub-events
    Description: Existing DynamoDB table for events (dashboard polling)

  ArtifactBucket:
    Type: String
    Default: your-artifact-bucket-name
    Description: S3 bucket for workflow artifacts

  GitHubLambdaName:
    Type: String
    Default: agentcore-hub-github-mcp
    Description: Lambda function name for GitHub API calls

  EventBus:
    Type: String
    Default: default
    Description: EventBridge bus name for publishing workflow events

  DeadSessionDetectorMode:
    Type: String
    Default: shadow
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Dead-session detector rollout (TEAM-3618 D1.2). off = skip the sweep;
      shadow = observe + metrics + shadow-flagged events, no writes;
      enforce = steal stale claims, retry once, then escalate.

  CascadeExtendedStates:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      Cascade extended-states rollout (TEAM-3618 D3 commit 4b). off = the unblock
      cascade only re-Readies {blocked, todo} dependents. on = a dependent
      in_progress whose last blocker resolves is lease-guarded (live lease →
      orchestrator.nudge only; stale lease → steal + re-dispatch via the claim
      CAS) and an in_review gate is re-woken (review.reawakened + gate re-run).

  ReconcileSweepMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Missed-unblock reconciliation sweep rollout (TEAM-3747 D1 / FR-D1.3
      backstop). off = dark: runSweep short-circuits before its first DynamoDB
      scan, so ZERO extra reads/writes; shadow = observe-only scan (metrics/logs
      of what WOULD be re-driven, no writes); enforce = re-drive stalled
      dependents. Default "off" matches the code's unset default, so the backstop
      ships dark — same rollout posture as deploy.sh (TEAM-3763 F2), which only
      forwards RECONCILE_SWEEP_MODE when explicitly set.

  EventDedupeMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "enforce"]
    Description: >
      Events-table double-write collapse (TEAM-4120 FR-2). Every event is stored
      TWICE today — once by the publisher's direct Put, once by the events-writer
      fan-out of the same EventBridge event, under two different eventIds. off =
      byte-identical to pre-4120 (random / base36 eventIds; consumers keep
      deduping by content); enforce = every writer derives the eventId from the
      event's CONTENT, so the fan-out Put lands on the same (workflowId, eventId)
      and overwrites the direct copy — one row per event. Default "off" matches
      the code's unset default, and deploy.sh only forwards EVENT_DEDUPE_MODE
      when explicitly set, so a fresh deploy is byte-identical. Instant rollback
      = set off. There is deliberately no "shadow": nothing is observable
      without changing the write.

  GateStateGuard:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Human review-gate state machine (TEAM-4120 FR-1). A gate reaching `blocked`
      is the ONLY signal the reject path has today, and it also fires for a
      creation-time dependency block, for the same rejection redelivered (or
      handled by both the Jira-webhook and DDB-stream twins), and for a gate no
      human was ever asked about. off = byte-identical to pre-4120: the guard
      returns "admitted" before its first read, so ZERO extra DynamoDB I/O.
      shadow = record gateStates + publish gate.reject_ignored{wouldDrop:true}
      but never drop a rejection (NOT byte-identical — it writes, so the ledger
      is populated before enforce). enforce = drop the unrequested/duplicate
      ones. Default "off" matches the code's unset default, and deploy.sh only
      forwards GATE_STATE_GUARD when explicitly set. Instant rollback = set off.

  DeadSessionEscalationMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Dead-session escalation tree (TEAM-4120 FR-3) — page, then synthesize or
      park, when the dead-session retry budget is spent. off = byte-identical to
      pre-4120: both emitters append the same evidence-free manager_escalation
      and the ticket stays held in `error`. shadow = page WITH evidence (last
      streamed words redacted, tickets spawned in the claim window, completion
      record, PR) and publish the decision it WOULD take; no board writes.
      enforce = also act — Done from a completion record that bears evidence AND
      was written during this claim, else block the ticket on the children the
      dead agent spawned (auto-reset capped to once per ticket), else park it on
      one human gate. It never steals a claim, never invokes an agent, and never
      marks a ticket Done on a stale or evidence-less record. Default "off"
      matches the code's unset default and deploy.sh only forwards the var when
      explicitly set. Instant rollback = set off.

Resources:
  # ─── Tables are pre-existing (not managed by this stack) ───────────────────────
  # Create with: scripts/create-dynamodb-tables.sh
  # agentcore-hub-tickets: PK=ticketId (S), GSI: parentId-index, assignee-index, Streams=NEW_AND_OLD_IMAGES
  # agentcore-hub-workflows: PK=workflowId (S), GSI: epicId-index — MUST be "workflowId" not "id"
  # agentcore-hub-events: PK=workflowId (S), SK=eventId (S), TTL on "ttl"
  #
  # ─── CRITICAL: Dependencies ────────────────────────────────────────────────────
  # agent-invoker.mjs requires @smithy/signature-v4 and @aws-crypto/sha256-js for
  # Runtime agent invocation (SigV4 signing). These MUST be in node_modules when
  # deploying. Run: npm install --omit=dev BEFORE creating the zip.
  # Deploy script: ./deploy.sh (handles install + zip + upload)

  # ─── Orchestration Lambda ──────────────────────────────────────────────────────
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-orchestrator
      Handler: index.handler
      CodeUri: .
      Timeout: 60  # Orchestrator is fast — just DynamoDB reads/writes + async invoke
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTableName
        - DynamoDBStreamReadPolicy:
            TableName: !Ref TicketsTableName
            StreamName: "*"
        - LambdaInvokePolicy:
            FunctionName: !Ref GitHubLambdaName
        - LambdaInvokePolicy:
            FunctionName: !Ref AgentInvokerFunction
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TicketsTableName}/stream/*"
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"]}'
        # Dead-session sweep (TEAM-3618 D1.2). SAM creates the rule + the
        # lambda:InvokeFunction permission for events.amazonaws.com. The sentinel
        # Input is what index.mjs branches on before any stream/webhook parsing.
        DeadSessionSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: agentcore-hub-dead-session-sweep
            Description: Invoke the orchestrator to sweep for dead agent sessions.
            Input: '{"source":"orchestrator.sweep","action":"dead_session_sweep"}'
        # Missed-unblock reconciliation sweep (TEAM-3747 D1 / FR-D1.3 backstop).
        # Same sentinel-Input pattern as DeadSessionSweep — index.mjs branches on
        # action=reconcile_sweep before any stream/webhook parsing. Dark by
        # default: RECONCILE_SWEEP_MODE=off (runSweep short-circuits before its
        # first scan), so scheduling it costs nothing until an operator opts in.
        #
        # SHAPE DIFFERENCE (do NOT "fix" one to match the other blindly): a SAM
        # Schedule event creates its OWN EventBridge rule, so this needs a rule
        # Name distinct from the dead-session rule. deploy.sh takes the other
        # valid shape — ONE rule (agentcore-hub-dead-session-sweep) with TWO
        # targets (dead_session_sweep + reconcile_sweep) — see deploy.sh
        # (TEAM-3763 F2). Both schedule the same reconcile_sweep action every 5m;
        # keep template.yaml and deploy.sh in agreement on that behavior.
        ReconcileSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: agentcore-hub-reconcile-sweep
            Description: Invoke the orchestrator to run the missed-unblock reconciliation sweep (TEAM-3747 D1 / FR-D1.3 backstop).
            Input: '{"source":"orchestrator.sweep","action":"reconcile_sweep"}'

  # ─── Agent Invoker Lambda (async, long-running) ────────────────────────────────
  AgentInvokerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-agent-invoker
      Handler: agent-invoker.handler
      CodeUri: .
      Timeout: 900  # 15 min for long agent runs
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowsTableName
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-agent-runtime:*
                - bedrock-agentcore:*
              Resource: "*"
        - LambdaInvokePolicy:
            FunctionName: !Ref GitHubLambdaName

  # ─── EventBridge Rule (route events to dashboard) ──────────────────────────────
  WorkflowEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: agentcore-hub-workflow-events
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - agentcore-hub.orchestrator
          - agentcore-hub.agent-invoker
      State: ENABLED
      Targets:
        - Id: EventsTableWriter
          Arn: !GetAtt EventsWriterFunction.Arn

  # ─── Lightweight Lambda to write EventBridge events to DynamoDB for polling ────
  EventsWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-events-writer
      Handler: events-writer.handler
      CodeUri: .
      Timeout: 10
      MemorySize: 128
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTableName

  EventsWriterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsWriterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WorkflowEventsRule.Arn

Outputs:
  OrchestratorFunctionArn:
    Description: Orchestrator Lambda ARN
    Value: !GetAtt OrchestratorFunction.Arn

  AgentInvokerFunctionArn:
    Description: Agent Invoker Lambda ARN
    Value: !GetAtt AgentInvokerFunction.Arn
