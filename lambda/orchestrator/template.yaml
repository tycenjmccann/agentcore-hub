AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AgentCore Hub Orchestrator — Event-driven workflow engine via DynamoDB Streams.
  Replaces the in-process Next.js orchestration with Lambda + Streams.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 900  # 15 min max for long agent invocations
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION_OVERRIDE: !Ref AWS::Region
        TICKETS_TABLE: !Ref TicketsTableName
        WORKFLOWS_TABLE: !Ref WorkflowsTableName
        EVENTS_TABLE: !Ref EventsTableName
        ARTIFACT_BUCKET: !Ref ArtifactBucket
        GITHUB_LAMBDA: !Ref GitHubLambdaName
        EVENT_BUS: !Ref EventBus
        PROJECT_KEY: TEAM
        DEAD_SESSION_DETECTOR_MODE: !Ref DeadSessionDetectorMode
        CASCADE_EXTENDED_STATES: !Ref CascadeExtendedStates
        RECONCILE_SWEEP_MODE: !Ref ReconcileSweepMode
        # Awaited-ids re-wake (TEAM-4166 D1/D2). Orchestrator-only (the derived
        # hook, level-triggered pickup, cascade/sweep/detector wiring all live
        # there); rides Globals for the same one-place-to-set parity.
        AWAITED_IDS_MODE: !Ref AwaitedIdsMode
        AWAITED_IDS_TIMEOUT_MINUTES: !Ref AwaitedIdsTimeoutMinutes
        CLEAN_EXIT_REDISPATCH_CAP: !Ref CleanExitRedispatchCap
        # Globals reaches all three writers (orchestrator, agent-invoker,
        # events-writer) in one place, which is exactly the requirement: the
        # double-write only collapses when all three agree on the mode.
        EVENT_DEDUPE_MODE: !Ref EventDedupeMode
        # Only the orchestrator reads this (it is the sole writer/reader of
        # gateStates); it rides Globals for one-place-to-set parity with the
        # other mode flags and is inert in the other two functions. deploy.sh
        # forwards it to the orchestrator only.
        GATE_STATE_GUARD: !Ref GateStateGuard
        # Orchestrator-only as well (both exhausted-retry emitters live there);
        # rides Globals for the same one-place-to-set parity.
        DEAD_SESSION_ESCALATION_MODE: !Ref DeadSessionEscalationMode
        # Orchestrator-only (the done twins + buildAgentContext live there);
        # rides Globals for the same one-place-to-set parity.
        LIVE_REVERIFY: !Ref LiveReverify
        # Orchestrator-only (the probe + context block + gate prefix all live
        # there); rides Globals for the same one-place-to-set parity.
        CI_CHECK_MODE: !Ref CiCheckMode
        # Orchestrator-only (both ready paths dispatch the CI agent); rides
        # Globals for the same one-place-to-set parity. AgentInvoker and
        # EventsWriter receive it too — neither reads it, so it is inert there.
        SYNC_MAIN_BEFORE_CI: !Ref SyncMainBeforeCi
        # Orchestrator-only (the completion gates + buildAgentContext + the
        # feature-branch adoption all live there); rides Globals for the same
        # one-place-to-set parity.
        ADVISORY_ROUTING: !Ref AdvisoryRouting

Parameters:
  TicketsTableName:
    Type: String
    Default: agentcore-hub-tickets
    Description: Existing DynamoDB table for tickets (must have Streams enabled)

  WorkflowsTableName:
    Type: String
    Default: agentcore-hub-workflows
    Description: Existing DynamoDB table for workflow metadata

  EventsTableName:
    Type: String
    Default: agentcore-hub-events
    Description: Existing DynamoDB table for events (dashboard polling)

  ArtifactBucket:
    Type: String
    Default: your-artifact-bucket-name
    Description: S3 bucket for workflow artifacts

  GitHubLambdaName:
    Type: String
    Default: agentcore-hub-github-mcp
    Description: Lambda function name for GitHub API calls

  EventBus:
    Type: String
    Default: default
    Description: EventBridge bus name for publishing workflow events

  DeadSessionDetectorMode:
    Type: String
    Default: shadow
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Dead-session detector rollout (TEAM-3618 D1.2). off = skip the sweep;
      shadow = observe + metrics + shadow-flagged events, no writes;
      enforce = steal stale claims, retry once, then escalate.

  CascadeExtendedStates:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      Cascade extended-states rollout (TEAM-3618 D3 commit 4b). off = the unblock
      cascade only re-Readies {blocked, todo} dependents. on = a dependent
      in_progress whose last blocker resolves is lease-guarded (live lease →
      orchestrator.nudge only; stale lease → steal + re-dispatch via the claim
      CAS) and an in_review gate is re-woken (review.reawakened + gate re-run).

  ReconcileSweepMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Missed-unblock reconciliation sweep rollout (TEAM-3747 D1 / FR-D1.3
      backstop). off = dark: runSweep short-circuits before its first DynamoDB
      scan, so ZERO extra reads/writes; shadow = observe-only scan (metrics/logs
      of what WOULD be re-driven, no writes); enforce = re-drive stalled
      dependents. Default "off" matches the code's unset default, so the backstop
      ships dark — same rollout posture as deploy.sh (TEAM-3763 F2), which only
      forwards RECONCILE_SWEEP_MODE when explicitly set.

  AwaitedIdsMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Awaited-ids re-wake (TEAM-4166 D1/D2). A release manager that parks itself
      in_progress on a sub-cap CHANGES-NEEDED and files sibling fix tickets never
      re-wakes when those fixes close — its blockedBy was frozen at def-time. When
      on, a fix ticket's spawnedBy origin (and any tool-reported precondition) is
      written as a REAL blockedBy edge on the parked ticket (status preserved via
      preserveStatusIf), so it re-wakes through the SAME unblock cascade with zero
      predicate change; the preconditionUnmet stamp is the D2 evidence that tells a
      clean park from a dead session. off = byte-identical (no edge writes, no
      derived hook, no level-triggered pickup — this flag MUTATES ticket state, so
      the safe default is dark); shadow = compute + metrics/logs, ZERO writes;
      enforce = write the edges + stamp. A garbage value coalesces to OFF (fail
      safe for a state-mutating flag). deploy.sh only forwards it when set.

  AwaitedIdsTimeoutMinutes:
    Type: String
    Default: "120"
    Description: >
      Wait-SLA for an awaited ticket (TEAM-4166 D1 §5). Once a ticket has awaited
      its open fixes longer than this, the sweep/detector emit ONE advisory
      orchestrator.await_timeout event (never a humanNotification, so it cannot
      trip parkedOnHuman). Default 120 minutes.

  CleanExitRedispatchCap:
    Type: String
    Default: "3"
    Description: >
      Clean-exit re-wake cap (TEAM-4166 D2 §2.3). How many times a cleanly-parked
      or genuinely-completed ticket may be automatically re-woken (counted on
      cleanExitRedispatches, NOT deadSessionRetries) before the wait-SLA takes
      over — it is NEVER escalated as a dead session on this clean path. Default 3.

  EventDedupeMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "enforce"]
    Description: >
      Events-table double-write collapse (TEAM-4120 FR-2). Every event is stored
      TWICE today — once by the publisher's direct Put, once by the events-writer
      fan-out of the same EventBridge event, under two different eventIds. off =
      byte-identical to pre-4120 (random / base36 eventIds; consumers keep
      deduping by content); enforce = every writer derives the eventId from the
      event's CONTENT, so the fan-out Put lands on the same (workflowId, eventId)
      and overwrites the direct copy — one row per event. Default "off" matches
      the code's unset default, and deploy.sh only forwards EVENT_DEDUPE_MODE
      when explicitly set, so a fresh deploy is byte-identical. Instant rollback
      = set off. There is deliberately no "shadow": nothing is observable
      without changing the write.

  GateStateGuard:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Human review-gate state machine (TEAM-4120 FR-1). A gate reaching `blocked`
      is the ONLY signal the reject path has today, and it also fires for a
      creation-time dependency block, for the same rejection redelivered (or
      handled by both the Jira-webhook and DDB-stream twins), and for a gate no
      human was ever asked about. off = byte-identical to pre-4120: the guard
      returns "admitted" before its first read, so ZERO extra DynamoDB I/O.
      shadow = record gateStates + publish gate.reject_ignored{wouldDrop:true}
      but never drop a rejection (NOT byte-identical — it writes, so the ledger
      is populated before enforce). enforce = drop the unrequested/duplicate
      ones. Default "off" matches the code's unset default, and deploy.sh only
      forwards GATE_STATE_GUARD when explicitly set. Instant rollback = set off.

  DeadSessionEscalationMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Dead-session escalation tree (TEAM-4120 FR-3) — page, then synthesize or
      park, when the dead-session retry budget is spent. off = byte-identical to
      pre-4120: both emitters append the same evidence-free manager_escalation
      and the ticket stays held in `error`. shadow = page WITH evidence (last
      streamed words redacted, tickets spawned in the claim window, completion
      record, PR) and publish the decision it WOULD take; no board writes.
      enforce = also act — Done from a completion record that bears evidence AND
      was written during this claim, else block the ticket on the children the
      dead agent spawned (auto-reset capped to once per ticket), else park it on
      one human gate. It never steals a claim, never invokes an agent, and never
      marks a ticket Done on a stale or evidence-less record. Default "off"
      matches the code's unset default and deploy.sh only forwards the var when
      explicitly set. Instant rollback = set off.

  LiveReverify:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Live-evidence re-verification (TEAM-4121 FR-9). A fix ticket that declared
      evidence_source=live — the finding was observed on a RUNNING system — is
      closed today on the dev's word: nobody re-runs the check at the new head,
      so the run ships on a claim. off = byte-identical to pre-4121 (the module is
      never constructed, the done twins take no extra read, and the release
      manager's context has no ## Unverified Fixes block). shadow = publish
      fix.reverify_planned{wouldCreate,wouldMarkUnverified} on each live fix's
      Done; zero ticket/workflow writes. enforce = also act — file ONE
      "Re-verify (QA): <fix> @ <sha7>" ticket per (fix, head), blocked on the fix
      and blocking the run's OPEN ship tickets, and mark a live fix whose
      completion record carries no live artifact `verification: unverified` so the
      release manager must re-run its repro before any PASS. Idempotent per (fix,
      head sha): re-Done'ing a fix files nothing new, a fix re-Done'd at a NEW
      head does. NOTE the asymmetry with REWORK_LOOP_CAP / FIX_TICKET_CONTRACT: a
      PRESENT-but-garbage value coalesces to OFF here, not shadow, because
      enforce creates real tickets that dispatch a real agent. Default "off"
      matches the code's unset default and deploy.sh only forwards the var when
      explicitly set. Instant rollback = set off.

  CiCheckMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      CI reachability pre-flight (TEAM-4122 FR-5). On a pipeline-mode run the CI
      agent is told to read the authoritative CodeBuild PR-check for the head SHA
      — but when the CI project has NO PR webhook and the pipeline-tools Lambda
      cannot StartBuild, no build can ever exist for any head, so the only honest
      verdict is a permanent BLOCKED that today is visible only inside the CI
      agent's completion record while the human merge gate looks green. off =
      byte-identical to pre-4122 (no probe, no CodeBuild/IAM SDK load — both are
      dynamic imports — and no context block). shadow = probe once per workflow
      (6h cache; 30min for an unknown) and state the verdict to every persona as a
      ## CI Certification block; zero ticket writes. enforce = also label the run's
      epic `ci:uncertifiable` (once per workflow) and prefix the human
      merge-gate's review package with the warning, so the approver is told before
      they click. `unknown` NEVER acts — a probe that could not answer must not
      manufacture a warning. Same asymmetry as LiveReverify: a PRESENT-but-garbage
      value coalesces to OFF, not shadow, because enforce writes to a real ticket.
      Default "off" matches the code's unset default and deploy.sh only forwards
      the var when explicitly set. Instant rollback = set off.

  SyncMainBeforeCi:
    Type: String
    Default: "enforce"
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Pre-CI default-branch sync (TEAM-4122 FR-6). Three dev agents push to one
      shared feature branch and the CI agent then certifies its head SHA — but the
      default branch has moved since they branched, so a green build says "this
      branch is green", not "green on top of what is on main now", which is how the
      human merge approver reads it. Every conflict and every clash with a sibling
      merge therefore surfaces AFTER the approval, on the merge itself, where no
      agent is watching. off = byte-identical to pre-4122 (no GitHub call, no
      event, no write). shadow = one compare read per CI dispatch plus a
      workflow.sync_dry_run event saying how far behind the branch is and whether a
      sync WOULD happen; it CANNOT tell you whether the merge would conflict (only
      an actual merge can), so conflictKnown is always false. enforce = merge the
      default branch INTO the feature branch (never the reverse — the merge
      direction is pinned in code and this can never write to the default branch)
      right before the CI agent is dispatched; a 409 files a `Fix (sync-main)`
      sync_fix ticket assigned to the dev who most recently finished on the run,
      blocks the CI ticket on it, and releases the CI ticket's claim so the normal
      cascade re-dispatches once it closes. Every other failure — no PAT, unknown
      repo, 404/422/5xx, network — fails OPEN and CI proceeds against the un-synced
      head, because a sync we could not do must never wedge CI. Same asymmetry as
      CiCheckMode: a PRESENT-but-garbage value coalesces to OFF, not shadow,
      because enforce PUSHES A COMMIT to a shared branch — that fail-safe is
      unchanged, which is exactly why the UNSET default is resolved separately
      from the allow-list (resolveSyncModeFromEnv, not normalizeSyncMode).
      Default is now "enforce" (TEAM-4188, from TEAM-4169 D1 FR-1.6): the flag is
      the only thing that decides whether a run syncs, so an install that never
      sets it must get the guarantee, not silently lose it. deploy.sh forwards the
      var unconditionally with the same "enforce" default, so all three surfaces
      agree. With no GITHUB_PAT this is still a silent no-op. Instant rollback =
      set off EXPLICITLY — an empty value counts as unset and re-arms enforce.

  AdvisoryRouting:
    Type: String
    Default: "off"
    AllowedValues: ["off", "enforce"]
    Description: >
      Advisory-ticket routing (TEAM-4122 FR-7). The requirements analyst and the
      release manager both file out-of-scope-but-worth-doing work as an ADVISORY
      ticket — `labels: "advisory"`, `blocked_by: ""`, no `spawned_by_kind` — which
      the blueprints describe as backlog the run does not wait on. Today the label
      is inert: the completion guard still waits for the ticket, and the dev picking
      it up is told to branch off the run's SHARED integration branch, so scope the
      humans explicitly declined lands in the unified PR next to the approved work.
      off = byte-identical to pre-4122 (the label means nothing). enforce = the
      label means what the prose promises: the ticket is filtered out of the
      completion, evidence, open-fix and ship-verdict gates, its `## Branch` block
      sends it to `feature/<id>-advisory` based on the repo DEFAULT branch with an
      instruction to PR there, and a `-advisory` branch is never adopted as a run's
      shared integration branch. There is deliberately NO shadow mode: the routing
      IS the prompt the agent acts on, so an observe-only variant would either lie
      to the agent (tell it one branch, log another) or do nothing at all. Roll out
      only after the create_ticket `labels` param is deployed on both ticket Lambdas
      and the runtime image — until tickets actually carry labels, enforce reads
      every ticket as non-advisory, i.e. exactly today's behaviour. A
      PRESENT-but-garbage value coalesces to OFF, because enforce changes what the
      run waits on. Default "off" matches the code's unset default and deploy.sh
      only forwards the var when explicitly set. Instant rollback = set off.

  CiProjectName:
    Type: String
    Default: agentcore-hub-ci
    Description: >
      The CodeBuild PR-check project the CI check probes, and the ONLY resource
      the orchestrator's codebuild:BatchGetProjects grant covers (F10 — a project
      description exposes webhook.url/secret and the project's env vars, so the
      grant is never project/*). A CD registry entry's `ciProject` overrides this
      per repo at read time, but the IAM scope is this one name — widen it here
      deliberately if you register a repo with a different CI project.

  PipelineToolsRoleArn:
    Type: String
    Default: ""
    Description: >
      Optional. The pipeline-tools Lambda's execution role, used ONLY when
      CI_CHECK_USE_IAM_SIMULATE=1 to read whether that role really holds
      codebuild:StartBuild instead of trusting the Lambda's self-reported
      capability. Left empty (the default), the simulate probe is skipped and NO
      iam:SimulatePrincipalPolicy statement is created at all.

Conditions:
  HasPipelineToolsRole: !Not [!Equals [!Ref PipelineToolsRoleArn, ""]]

Resources:
  # ─── Tables are pre-existing (not managed by this stack) ───────────────────────
  # Create with: scripts/create-dynamodb-tables.sh
  # agentcore-hub-tickets: PK=ticketId (S), GSI: parentId-index, assignee-index, Streams=NEW_AND_OLD_IMAGES
  # agentcore-hub-workflows: PK=workflowId (S), GSI: epicId-index — MUST be "workflowId" not "id"
  # agentcore-hub-events: PK=workflowId (S), SK=eventId (S), TTL on "ttl"
  #
  # ─── CRITICAL: Dependencies ────────────────────────────────────────────────────
  # agent-invoker.mjs requires @smithy/signature-v4 and @aws-crypto/sha256-js for
  # Runtime agent invocation (SigV4 signing). These MUST be in node_modules when
  # deploying. Run: npm install --omit=dev BEFORE creating the zip.
  # Deploy script: ./deploy.sh (handles install + zip + upload)

  # ─── Orchestration Lambda ──────────────────────────────────────────────────────
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-orchestrator
      Handler: index.handler
      CodeUri: .
      Timeout: 60  # Orchestrator is fast — just DynamoDB reads/writes + async invoke
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTableName
        - DynamoDBStreamReadPolicy:
            TableName: !Ref TicketsTableName
            StreamName: "*"
        - LambdaInvokePolicy:
            FunctionName: !Ref GitHubLambdaName
        - LambdaInvokePolicy:
            FunctionName: !Ref AgentInvokerFunction
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        # CI reachability probe (TEAM-4122 FR-5). F10: scoped to the ONE CI
        # project, never project/* — BatchGetProjects returns webhook.url,
        # webhook.secret and the project's environment variables, so read access
        # to every project in the account would be a real secret-exposure widening.
        # Inert when CI_CHECK_MODE=off (the probe is never called).
        - Statement:
            - Effect: Allow
              Action: codebuild:BatchGetProjects
              Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${CiProjectName}"
        # Optional simulate probe — created ONLY when PipelineToolsRoleArn is set,
        # and scoped to that single role.
        - !If
          - HasPipelineToolsRole
          - Statement:
              - Effect: Allow
                Action: iam:SimulatePrincipalPolicy
                Resource: !Ref PipelineToolsRoleArn
          - !Ref "AWS::NoValue"
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TicketsTableName}/stream/*"
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"]}'
        # Dead-session sweep (TEAM-3618 D1.2). SAM creates the rule + the
        # lambda:InvokeFunction permission for events.amazonaws.com. The sentinel
        # Input is what index.mjs branches on before any stream/webhook parsing.
        DeadSessionSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: agentcore-hub-dead-session-sweep
            Description: Invoke the orchestrator to sweep for dead agent sessions.
            Input: '{"source":"orchestrator.sweep","action":"dead_session_sweep"}'
        # Missed-unblock reconciliation sweep (TEAM-3747 D1 / FR-D1.3 backstop).
        # Same sentinel-Input pattern as DeadSessionSweep — index.mjs branches on
        # action=reconcile_sweep before any stream/webhook parsing. Dark by
        # default: RECONCILE_SWEEP_MODE=off (runSweep short-circuits before its
        # first scan), so scheduling it costs nothing until an operator opts in.
        #
        # SHAPE DIFFERENCE (do NOT "fix" one to match the other blindly): a SAM
        # Schedule event creates its OWN EventBridge rule, so this needs a rule
        # Name distinct from the dead-session rule. deploy.sh takes the other
        # valid shape — ONE rule (agentcore-hub-dead-session-sweep) with TWO
        # targets (dead_session_sweep + reconcile_sweep) — see deploy.sh
        # (TEAM-3763 F2). Both schedule the same reconcile_sweep action every 5m;
        # keep template.yaml and deploy.sh in agreement on that behavior.
        ReconcileSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: agentcore-hub-reconcile-sweep
            Description: Invoke the orchestrator to run the missed-unblock reconciliation sweep (TEAM-3747 D1 / FR-D1.3 backstop).
            Input: '{"source":"orchestrator.sweep","action":"reconcile_sweep"}'

  # ─── Agent Invoker Lambda (async, long-running) ────────────────────────────────
  AgentInvokerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-agent-invoker
      Handler: agent-invoker.handler
      CodeUri: .
      Timeout: 900  # 15 min for long agent runs
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowsTableName
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-agent-runtime:*
                - bedrock-agentcore:*
              Resource: "*"
        - LambdaInvokePolicy:
            FunctionName: !Ref GitHubLambdaName

  # ─── EventBridge Rule (route events to dashboard) ──────────────────────────────
  WorkflowEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: agentcore-hub-workflow-events
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - agentcore-hub.orchestrator
          - agentcore-hub.agent-invoker
      State: ENABLED
      Targets:
        - Id: EventsTableWriter
          Arn: !GetAtt EventsWriterFunction.Arn

  # ─── Lightweight Lambda to write EventBridge events to DynamoDB for polling ────
  EventsWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-events-writer
      Handler: events-writer.handler
      CodeUri: .
      Timeout: 10
      MemorySize: 128
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTableName

  EventsWriterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsWriterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WorkflowEventsRule.Arn

Outputs:
  OrchestratorFunctionArn:
    Description: Orchestrator Lambda ARN
    Value: !GetAtt OrchestratorFunction.Arn

  AgentInvokerFunctionArn:
    Description: Agent Invoker Lambda ARN
    Value: !GetAtt AgentInvokerFunction.Arn
