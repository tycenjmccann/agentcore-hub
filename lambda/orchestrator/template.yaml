AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AgentCore Hub Orchestrator — Event-driven workflow engine via DynamoDB Streams.
  Replaces the in-process Next.js orchestration with Lambda + Streams.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 900  # 15 min max for long agent invocations
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION_OVERRIDE: !Ref AWS::Region
        TICKETS_TABLE: !Ref TicketsTableName
        WORKFLOWS_TABLE: !Ref WorkflowsTableName
        EVENTS_TABLE: !Ref EventsTableName
        ARTIFACT_BUCKET: !Ref ArtifactBucket
        GITHUB_LAMBDA: !Ref GitHubLambdaName
        EVENT_BUS: !Ref EventBus
        PROJECT_KEY: TEAM
        DEAD_SESSION_DETECTOR_MODE: !Ref DeadSessionDetectorMode
        CASCADE_EXTENDED_STATES: !Ref CascadeExtendedStates
        RECONCILE_SWEEP_MODE: !Ref ReconcileSweepMode
        GATE_BYPASS_MODE: !Ref GateBypassMode
        FIX_VERIFICATION_REQUIRED: !Ref FixVerificationRequired
        CODING_AGENT_RUNTIME_ARN: !Ref CodingAgentRuntimeArn
        OTEL_ACTIVITY_CONFIRM: !Ref OtelActivityConfirm
        OTEL_SPANS_LOG_GROUP: !Ref OtelSpansLogGroup
        OTEL_QUERY_TIMEOUT_MS: !Ref OtelQueryTimeoutMs
        OTEL_QUERY_BUDGET_PER_SWEEP: !Ref OtelQueryBudgetPerSweep

Parameters:
  TicketsTableName:
    Type: String
    Default: agentcore-hub-tickets
    Description: Existing DynamoDB table for tickets (must have Streams enabled)

  WorkflowsTableName:
    Type: String
    Default: agentcore-hub-workflows
    Description: Existing DynamoDB table for workflow metadata

  EventsTableName:
    Type: String
    Default: agentcore-hub-events
    Description: Existing DynamoDB table for events (dashboard polling)

  ArtifactBucket:
    Type: String
    Default: your-artifact-bucket-name
    Description: S3 bucket for workflow artifacts

  GitHubLambdaName:
    Type: String
    Default: agentcore-hub-github-mcp
    Description: Lambda function name for GitHub API calls

  EventBus:
    Type: String
    Default: default
    Description: EventBridge bus name for publishing workflow events

  DeadSessionDetectorMode:
    Type: String
    Default: enforce
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Dead-session detector rollout (TEAM-3618 D1.2). off = skip the sweep;
      shadow = observe + metrics + shadow-flagged events, no writes;
      enforce = steal stale claims, retry once, then escalate. Default flipped
      shadow -> enforce by TEAM-4099 F8: shadow returns before the
      stamp/steal/synthesize, so D1.2's dead-session salvage (TEAM-3790) and
      D4.3's stall re-dispatch (TEAM-2609) produced NO writes in a default
      deploy - their ACs were unmet as deployed, not merely un-flipped. Matches
      the code default in index.mjs. Set shadow explicitly to observe first.

  CascadeExtendedStates:
    Type: String
    Default: "off"
    # "shadow" is accepted by the code (resolveCascadeMode is tri-state as of
    # TEAM-3747 D1) but was missing here, so the template could not express the
    # observe-only step of its own rollout. "on" is kept as the legacy alias for
    # enforce. Stays OFF by default: shadow is NOT read-free (the extended path
    # issues its blocker-confirm + lease reads before the no-write check), and no
    # AC needs it now that the reconcile sweep enforces under the same lease floor.
    AllowedValues: ["off", "shadow", "enforce", "on"]
    Description: >
      Cascade extended-states rollout (TEAM-3618 D3 commit 4b). off = the unblock
      cascade only re-Readies {blocked, todo} dependents. on = a dependent
      in_progress whose last blocker resolves is lease-guarded (live lease →
      orchestrator.nudge only; stale lease → steal + re-dispatch via the claim
      CAS) and an in_review gate is re-woken (review.reawakened + gate re-run).

  ReconcileSweepMode:
    Type: String
    Default: enforce
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Missed-unblock reconciliation sweep rollout (TEAM-3747 D1 / FR-D1.3
      backstop). off = dark: runSweep short-circuits before its first DynamoDB
      scan, so ZERO extra reads/writes; shadow = observe-only scan (metrics/logs
      of what WOULD be re-driven, no writes); enforce = re-drive stalled
      dependents, retry outstanding epic roll-ups (D2.3) and re-evaluate
      gate-bypass flags. Default flipped off -> enforce by TEAM-4099 F8: dark by
      default also disabled the 2-minute ready SLA (wf sffzti's 21:04 dispatch),
      the roll-up retry, and F7's "the rest is left to the sweep" bound - a
      backstop that is off by default is not a backstop. Matches the code
      default in index.mjs. Set shadow (or off) explicitly to opt back out.

  GateBypassMode:
    Type: String
    Default: enforce
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      Merge-without-approval detection (TEAM-3991 D1.1). off = skip the check
      entirely; shadow = detect + publish workflow.gate_bypass, no writes to the
      ticket or the run; enforce = additionally flag the task
      (gateBypassFlaggedAt, which also blocks re-claim), push the ticket back to
      in_review, raise one manager_escalation per offending merge commit, and
      hold the run open at completion until a human acks. Default "enforce"
      matches the code default in gate-bypass.mjs gateBypassMode() — unlike the
      sweeps this ships ON, because the failure it catches (a run closing green
      over an unapproved merge) is exactly what it must not miss.

  FixVerificationRequired:
    Type: String
    Default: enforce
    AllowedValues: ["off", "shadow", "enforce"]
    Description: >
      SHA-pinned fix-verification gate (TEAM-3992 Q4/D3.2). off = skip the check;
      shadow = detect + publish workflow.completion_blocked (reason fix_unverified),
      no block; enforce = hold the run open at completion when a done fix ticket was
      not re-verified at its FINAL commit SHA by every role its kind re-arms, and
      raise one manager_escalation. Inert unless the run's def declares
      ticketDag.fixRearm. Default "enforce" matches the code default in index.mjs —
      a fix closing green without re-verification is exactly what it must not miss.

  CodingAgentRuntimeArn:
    Type: String
    Default: ""
    Description: >
      Coding-runtime health gate (TEAM-3992 D4.2). The AgentRuntime ARN of the
      shared coding-agent runtime (deploy/coding-agent-runtime/). When set, the
      orchestrator poll-probes it before dispatching a coding ticket
      (claude_code/codex/kiro), parks tickets blocked:runtime during an outage,
      and auto-resumes them on recovery. Unset (default) fails OPEN — the gate is
      dark and dispatch behaves exactly as pre-D4.2. No hardcoded ARN/account:
      supply via CODING_AGENT_RUNTIME_ARN from deploy/config.sh.

  OtelActivityConfirm:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >
      OTEL span-confirmation for the dead-session detector's stall soft-timeout
      (TEAM-3992 D4.3). off (default) = the detector never queries CloudWatch Logs
      Insights: a soft-stale claim is only ever stolen once its silence passes the
      absolute hard ceiling (2× the soft-timeout) — the 4v1ykk TEAM-2609 class. on
      = below the hard ceiling the detector confirms death against aws/spans before
      stealing, so a genuinely-working agent whose stream heartbeats lapsed is not
      recovered mid-turn. Ships off — the hard ceiling alone is the safe backstop.

  OtelSpansLogGroup:
    Type: String
    Default: aws/spans
    Description: >
      CloudWatch Logs group holding the fleet's OTEL spans, queried by the stall
      soft-timeout confirmation probe (TEAM-3992 D4.3). Default aws/spans matches
      the group the runtime + traces already emit to.

  OtelQueryTimeoutMs:
    Type: String
    Default: "15000"
    Description: >
      Per-query wall-clock budget (ms) for the OTEL span-confirmation Logs Insights
      poll (TEAM-3992 D4.3). A query that has not reached Complete by then yields
      the "unknown" sentinel, which NEVER escalates a soft-stale to a steal.

  OtelQueryBudgetPerSweep:
    Type: String
    Default: "5"
    Description: >
      Maximum OTEL confirmation queries a single dead-session sweep may issue
      (TEAM-3992 D4.3), bounding Logs Insights fan-out when many claims go
      soft-stale at once. Over budget yields the "unknown" sentinel (no steal).

Conditions:
  # The coding-runtime health gate's InvokeAgentRuntime grant is only added when a
  # runtime ARN is supplied — an empty Resource would be an invalid IAM policy,
  # and a dark gate needs no permission.
  HasCodingRuntime: !Not [!Equals [!Ref CodingAgentRuntimeArn, ""]]

Resources:
  # ─── Tables are pre-existing (not managed by this stack) ───────────────────────
  # Create with: scripts/create-dynamodb-tables.sh
  # agentcore-hub-tickets: PK=ticketId (S), GSI: parentId-index, assignee-index, Streams=NEW_AND_OLD_IMAGES
  # agentcore-hub-workflows: PK=workflowId (S), GSI: epicId-index — MUST be "workflowId" not "id"
  # agentcore-hub-events: PK=workflowId (S), SK=eventId (S), TTL on "ttl"
  #
  # ─── CRITICAL: Dependencies ────────────────────────────────────────────────────
  # agent-invoker.mjs requires @smithy/signature-v4 and @aws-crypto/sha256-js for
  # Runtime agent invocation (SigV4 signing). These MUST be in node_modules when
  # deploying. Run: npm install --omit=dev BEFORE creating the zip.
  # Deploy script: ./deploy.sh (handles install + zip + upload)

  # ─── Orchestration Lambda ──────────────────────────────────────────────────────
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-orchestrator
      Handler: index.handler
      CodeUri: .
      Timeout: 60  # Orchestrator is fast — just DynamoDB reads/writes + async invoke
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTableName
        - DynamoDBStreamReadPolicy:
            TableName: !Ref TicketsTableName
            StreamName: "*"
        - LambdaInvokePolicy:
            FunctionName: !Ref GitHubLambdaName
        - LambdaInvokePolicy:
            FunctionName: !Ref AgentInvokerFunction
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        # TEAM-3992 D4.2 — the coding-runtime health gate persists its outage
        # state object under runtime-health/*. Read is already covered by
        # S3ReadPolicy above; grant scoped write/delete on that prefix only.
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/runtime-health/*"
        # InvokeAgentRuntime on the coding runtime ONLY — scoped to the configured
        # ARN (+ its endpoints), added only when an ARN is supplied.
        - !If
          - HasCodingRuntime
          - Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Ref CodingAgentRuntimeArn
                  - !Sub "${CodingAgentRuntimeArn}/runtime-endpoint/*"
          - !Ref AWS::NoValue
        # TEAM-3992 D4.3 — the stall soft-timeout's OTEL span-confirmation probe
        # runs a CloudWatch Logs Insights query over the aws/spans log group.
        # StartQuery/StopQuery accept resource-level scoping (the aws/spans group);
        # GetQueryResults does NOT support resource-level permissions and must be
        # granted on "*" (see the CloudWatch Logs IAM reference — it is keyed by
        # queryId, not log group). The probe is dark unless OTEL_ACTIVITY_CONFIRM=on,
        # but the grant is always present so enabling the flag needs no redeploy.
        - Statement:
            - Effect: Allow
              Action:
                - logs:StartQuery
                - logs:StopQuery
              Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*"
            - Effect: Allow
              Action:
                - logs:GetQueryResults
              Resource: "*"  # GetQueryResults has no resource-level permission support
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TicketsTableName}/stream/*"
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 1
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"]}'
        # Dead-session sweep (TEAM-3618 D1.2). SAM creates the rule + the
        # lambda:InvokeFunction permission for events.amazonaws.com. The sentinel
        # Input is what index.mjs branches on before any stream/webhook parsing.
        DeadSessionSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: agentcore-hub-dead-session-sweep
            Description: Invoke the orchestrator to sweep for dead agent sessions.
            Input: '{"source":"orchestrator.sweep","action":"dead_session_sweep"}'
        # Missed-unblock reconciliation sweep (TEAM-3747 D1 / FR-D1.3 backstop).
        # Same sentinel-Input pattern as DeadSessionSweep — index.mjs branches on
        # action=reconcile_sweep before any stream/webhook parsing. Dark by
        # default: RECONCILE_SWEEP_MODE=off (runSweep short-circuits before its
        # first scan), so scheduling it costs nothing until an operator opts in.
        #
        # SHAPE DIFFERENCE (do NOT "fix" one to match the other blindly): a SAM
        # Schedule event creates its OWN EventBridge rule, so this needs a rule
        # Name distinct from the dead-session rule. deploy.sh takes the other
        # valid shape — ONE rule (agentcore-hub-dead-session-sweep) with TWO
        # targets (dead_session_sweep + reconcile_sweep) — see deploy.sh
        # (TEAM-3763 F2). Both schedule the same reconcile_sweep action every 5m;
        # keep template.yaml and deploy.sh in agreement on that behavior.
        ReconcileSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: agentcore-hub-reconcile-sweep
            Description: Invoke the orchestrator to run the missed-unblock reconciliation sweep (TEAM-3747 D1 / FR-D1.3 backstop).
            Input: '{"source":"orchestrator.sweep","action":"reconcile_sweep"}'
        # Coding-runtime recovery sweep (TEAM-3992 D4.2). Same sentinel pattern —
        # index.mjs branches on action=runtime_health_sweep. No-op (one S3 head)
        # unless CODING_AGENT_RUNTIME_ARN is set and an outage object is open, so
        # scheduling it is free until the gate is armed. deploy.sh folds the same
        # action into its single dead-session rule as a third target.
        RuntimeHealthSweep:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: agentcore-hub-runtime-health-sweep
            Description: Invoke the orchestrator to re-probe the coding runtime and auto-resume parked coding tickets on recovery (TEAM-3992 D4.2).
            Input: '{"source":"orchestrator.sweep","action":"runtime_health_sweep"}'

  # ─── Agent Invoker Lambda (async, long-running) ────────────────────────────────
  AgentInvokerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-agent-invoker
      Handler: agent-invoker.handler
      CodeUri: .
      Timeout: 900  # 15 min for long agent runs
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TicketsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkflowsTableName
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref EventBus
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock-agent-runtime:*
                - bedrock-agentcore:*
              Resource: "*"
        - LambdaInvokePolicy:
            FunctionName: !Ref GitHubLambdaName

  # ─── EventBridge Rule (route events to dashboard) ──────────────────────────────
  WorkflowEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: agentcore-hub-workflow-events
      EventBusName: !Ref EventBus
      EventPattern:
        source:
          - agentcore-hub.orchestrator
          - agentcore-hub.agent-invoker
      State: ENABLED
      Targets:
        - Id: EventsTableWriter
          Arn: !GetAtt EventsWriterFunction.Arn

  # ─── Lightweight Lambda to write EventBridge events to DynamoDB for polling ────
  EventsWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: agentcore-hub-events-writer
      Handler: events-writer.handler
      CodeUri: .
      Timeout: 10
      MemorySize: 128
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTableName

  EventsWriterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsWriterFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WorkflowEventsRule.Arn

Outputs:
  OrchestratorFunctionArn:
    Description: Orchestrator Lambda ARN
    Value: !GetAtt OrchestratorFunction.Arn

  AgentInvokerFunctionArn:
    Description: Agent Invoker Lambda ARN
    Value: !GetAtt AgentInvokerFunction.Arn
