# Config Evals Gate (FR-4/FR-6) — PR gate for prompt/config/blueprint changes.
#
# Always-run design (C1 / FR-2.6): the workflow triggers on EVERY pull_request
# (no `paths:` filter) and computes the gated-path filter INSIDE the workflow
# (changed-paths job). A trigger-level `paths:` filter would mean PRs touching
# no gated path get NO `config-evals-gate` check run at all — making the check
# unusable as a required status check in branch protection (every unrelated PR
# would hang on "Expected — waiting"). Instead, the skip-publish job publishes
# an explicit SUCCESS check ("SKIPPED — no gated paths changed") for ungated
# same-repo PRs, so the check is always present and can safely be marked
# required. (Fork PRs are the deliberate exception — see CRED-2.)
# Path detection FAILS CLOSED: if changed-paths cannot list the PR's files,
# the PR is treated as gated (publish/fork-guard use `gated != 'false'`).
#
# Hardened per the TEAM-3066 security review:
#   HERM-1  The job that executes PR code (battery) has NO checks:write and no
#           on-disk git credential (persist-credentials: false + preflight
#           assertion). Check publication happens in a separate job (publish)
#           that checks out nothing and executes zero PR code.
#   HERM-3  (TEAM-3425) Everything EXECUTABLE in the battery job comes from the
#           TRUSTED BASE revision: the workspace is checked out at
#           pull_request.base.sha, so the harness (evals/battery/** runner,
#           lib, scoring), npm ci's package*.json, and the workflow-adjacent
#           tooling are all pre-merge-reviewed code the PR cannot modify. The
#           PR head is checked out into a side directory and ONLY the gated
#           CANDIDATE CONFIG paths (prompts, workflow-manager config,
#           blueprints, workflows/agents JSON) are overlaid into the workspace
#           before the battery runs (FR-2.2: the gate scores PR-head config).
#           Without this, a same-repo PR editing evals/battery/** would run its
#           own evaluator and could fabricate the PASS artifact that publish
#           trusts — the HERM-1 job split alone is not a trust boundary around
#           an attacker-controlled artifact. Consequence: a PR that changes the
#           runner/harness is exercised by the BASE harness; the runner change
#           takes effect only after it merges.
#   CRED-2  (revised by TEAM-3425) Fork PRs never receive credentials and never
#           run the battery — the gate is formally SAME-REPO ONLY. On fork
#           `pull_request` events GitHub downgrades GITHUB_TOKEN to read-only
#           and does NOT honor a job-level `checks: write` request, so this
#           workflow can never publish a `config-evals-gate` check run for a
#           fork PR. (This supersedes the previous "publish an explicit failing
#           check" fork-guard design, which could never execute — its
#           checks.create always returned 403.) Enforcement is the required
#           check's ABSENCE: with `config-evals-gate` required in branch
#           protection, a fork PR sits at "Expected — waiting" and cannot merge
#           (fail closed). fork-guard fails visibly for gated-or-undetermined
#           fork PRs (plain exit 1 — no checks.create attempt) to say why;
#           ungated fork PRs get the informational fork-notice job instead.
#           Maintainers gate a fork contribution by pushing its branch to the
#           base repository and opening a same-repo PR.
#   CRED-3  The OIDC role session is named gha-<run_id>-<actor> so every
#           Bedrock/S3 call in CloudTrail attributes to a specific run + human.
#
# Trigger is `pull_request` — NEVER `pull_request_target`, which would run
# PR-controlled code with base-repo credentials (HERM-1).
name: Config Evals Gate

on:
  pull_request:

concurrency:
  group: config-evals-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: nothing at the workflow level; each job asks for exactly
# what it needs.
permissions: {}

jobs:
  # Decides whether this PR touches any gated path. Runs for ALL PRs — same-repo
  # AND forks — which is safe because it executes zero PR code (github-script
  # against the API only, no checkout). The path list must stay EXACTLY in sync
  # with config-evals-baseline.yml's push paths, plus the two workflow files
  # themselves: a PR that edits the gate must run the gate (fail closed).
  changed-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      gated: ${{ steps.filter.outputs.gated }}
    steps:
      - name: Detect gated-path changes
        id: filter
        uses: actions/github-script@v7
        with:
          script: |
            // Keep in sync with config-evals-baseline.yml `on.push.paths`.
            const gatedPrefixes = [
              "deploy/runtime-agent/prompts/", // deploy/runtime-agent/prompts/**
              "deploy/workflow-manager/",      // deploy/workflow-manager/** (TEAM-3295: whole dir, not just system-prompt.md)
              "blueprints/",                   // blueprints/**
              "evals/battery/",                // evals/battery/**
            ];
            const gatedFiles = [
              "src/config/workflows.json",
              "src/config/agents.json",
              // The gate workflows themselves: changes to the gate run the gate.
              ".github/workflows/config-evals-gate.yml",
              ".github/workflows/config-evals-baseline.yml",
            ];
            const isGated = (name) =>
              typeof name === "string" &&
              (gatedFiles.includes(name) ||
                gatedPrefixes.some((p) => name.startsWith(p)));

            // FAIL CLOSED: no try/catch — if listing files throws, this job
            // fails, the `gated` output stays empty, and publish/fork-guard
            // (`gated != 'false'`) treat the PR as gated.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // A rename out of a gated path changes gated content too, so
            // previous_filename counts as well (matches git-diff semantics).
            const hits = files
              .filter((f) => isGated(f.filename) || isGated(f.previous_filename))
              .map((f) => f.filename);
            const gated = hits.length > 0;
            core.info(
              gated
                ? `Gated paths changed (${hits.length}):\n${hits.join("\n")}`
                : `No gated paths among ${files.length} changed file(s).`
            );
            core.setOutput("gated", gated ? "true" : "false");

  # The ONLY job that touches PR content. Even here nothing PR-controlled ever
  # EXECUTES: the harness runs from the trusted base revision and only reads
  # the PR's candidate config as data (HERM-3). It cannot publish checks
  # (HERM-1) and only runs for same-repo branches (CRED-2 — forks get
  # fork-guard instead).
  battery:
    needs: changed-paths
    if: needs.changed-paths.outputs.gated == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A hung battery hits this timeout ⇒ failed job ⇒ publish reports a FAILED
    # check. Never neutral, never absent.
    timeout-minutes: 15
    permissions:
      contents: read # checkout only
      id-token: write # OIDC role assumption
      # NO checks:write here (HERM-1): PR code must not be able to green-light itself.
    environment: config-evals
    steps:
      # HERM-3: the WORKSPACE is the trusted base revision — the harness that
      # computes the verdict is always pre-merge-reviewed code. PR-head config
      # is overlaid below; evals/battery/** is deliberately NOT.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # HERM-1: leave no token on disk for PR code to exfiltrate.
          persist-credentials: false

      # PR head goes into a SIDE directory only. Nothing in here is executed;
      # the overlay step copies out the candidate config paths and deletes the
      # rest (including this copy of evals/battery/** and .github/**).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Assert no on-disk git credential (HERM-1)
        run: |
          set -euo pipefail
          for repo in . pr-head; do
            extraheader="$(git -C "$repo" config --get http.https://github.com/.extraheader || true)"
            if [ -n "$extraheader" ]; then
              echo "::error::git http extraheader credential persisted in $repo despite persist-credentials:false — refusing to run PR code"
              exit 1
            fi
            if grep -qi authorization "$repo/.git/config"; then
              echo "::error::authorization header present in $repo/.git/config — refusing to run PR code"
              exit 1
            fi
          done

      - name: Overlay candidate config from PR head (HERM-3 / FR-2.2)
        # Trust boundary: ONLY the gated CONFIG paths cross from pr-head into
        # the workspace — exactly what the gate exists to score. Executable
        # paths (evals/battery/**, .github/**, package*.json, src code) stay at
        # the base revision, so a PR mutating the runner/evaluator cannot
        # influence the verdict artifact the publish job trusts.
        run: |
          set -euo pipefail
          # Directories are replaced wholesale (remove base copy, then copy the
          # head copy) so files the PR DELETES do not linger from base. A
          # directory absent at head stays deleted.
          for dir in deploy/runtime-agent/prompts deploy/workflow-manager blueprints; do
            rm -rf "$dir"
            if [ -d "pr-head/$dir" ]; then
              mkdir -p "$(dirname "$dir")"
              cp -R "pr-head/$dir" "$dir"
            fi
          done
          # Single files: head copy wins; absent at head means the PR deleted it.
          for f in src/config/workflows.json src/config/agents.json; do
            if [ -f "pr-head/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "pr-head/$f" "$f"
            else
              rm -f "$f"
            fi
          done
          # Nothing else may be read from the PR head: drop it (and its .git)
          # before any harness code runs.
          rm -rf pr-head

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Assume eval-gate role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_GATE_ROLE_ARN }}
          aws-region: us-east-1
          # CRED-3: attributable session name — CloudTrail ties every call
          # made by this job to the exact run and the human who triggered it.
          role-session-name: gha-${{ github.run_id }}-${{ github.actor }}

      - name: Restore flake ledger (best-effort, TEAM-3090)
        # Cross-run verdict history for flake flagging. The ledger only feeds
        # INFORMATIONAL flaky-candidate flags (lib/flake.mjs is report-only;
        # nothing read from it can alter the gate verdict), so a stale or
        # PR-poisoned cache cannot green-light or block a PR. No new
        # permissions: actions/cache needs only the job's existing
        # contents:read. The run_id key never hits, so restore always falls
        # through to the newest prior ledger via the prefix restore-key.
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/flake-ledger.jsonl
          key: config-evals-flake-ledger-${{ github.run_id }}
          restore-keys: |
            config-evals-flake-ledger-

      - name: Run battery
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # run-battery.mjs writes check-summary.md next to --results and exits
        # non-zero on a FAIL verdict, so a red battery job ⇔ red gate.
        # --base-ref is the base sha the workspace itself is checked out at
        # (HERM-3): resolveGateConfig's `git show <ref>:<path>` reads of
        # baseline/thresholds/manifest/case gating knobs (B2) resolve against
        # that commit, which the depth-1 checkout guarantees is present — no
        # separate fetch needed.
        run: node evals/battery/run-battery.mjs --results "$RUNNER_TEMP/battery-results.json" --base-ref "$BASE_SHA" --flake-ledger "$RUNNER_TEMP/flake-ledger.jsonl"

      - name: Save flake ledger (best-effort, TEAM-3090)
        # Unique per-run key so the save never conflicts; the next run's
        # restore picks the newest via the prefix restore-key. always():
        # a FAILing run's verdict is exactly what the flip counter needs.
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/flake-ledger.jsonl
          key: config-evals-flake-ledger-${{ github.run_id }}

      - name: Upload results
        # always(): the publish job needs the artifact even (especially) when
        # the battery failed — verdict + summary end up in the check run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-results
          path: |
            ${{ runner.temp }}/battery-results.json
            ${{ runner.temp }}/check-summary.md
            ${{ runner.temp }}/flake-ledger.jsonl
          if-no-files-found: ignore

  # Publishes the `config-evals-gate` check run. Runs NO PR code — no checkout
  # at all (HERM-1 split): its only inputs are the artifact and job status.
  # `gated != 'false'` (not `== 'true'`): if changed-paths itself failed, its
  # output is empty and the PR must still get a check — a FAILING one (fail
  # closed), since we could not prove the PR touches no gated path.
  publish:
    needs: [changed-paths, battery]
    if: always() && needs.changed-paths.outputs.gated != 'false' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write # the ONLY permission — and the only job that has it
    steps:
      - uses: actions/download-artifact@v4
        # continue-on-error: a battery job that died before uploading (crash,
        # timeout, cancellation) must still yield a FAILING check below.
        continue-on-error: true
        with:
          name: battery-results
          path: ${{ runner.temp }}/battery-results

      - name: Publish check run (fail closed)
        uses: actions/github-script@v7
        env:
          BATTERY_JOB_RESULT: ${{ needs.battery.result }}
          CHANGED_PATHS_RESULT: ${{ needs.changed-paths.result }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const dir = path.join(process.env.RUNNER_TEMP, "battery-results");
            const jobResult = process.env.BATTERY_JOB_RESULT;
            const pathsResult = process.env.CHANGED_PATHS_RESULT;

            let results = null;
            try {
              results = JSON.parse(fs.readFileSync(path.join(dir, "battery-results.json"), "utf8"));
            } catch { /* missing/unparseable artifact ⇒ stays null ⇒ failure */ }
            let summaryMd = "";
            try {
              summaryMd = fs.readFileSync(path.join(dir, "check-summary.md"), "utf8");
            } catch { /* optional */ }

            // Fail closed in EVERY branch: success requires the artifact to
            // exist, the verdict to be PASS, and the battery job to have
            // succeeded. Missing artifact, FAIL verdict, job failure,
            // cancellation, timeout, and a failed path detection all land on
            // "failure".
            let conclusion = "failure";
            let title;
            if (results && results.verdict === "PASS" && jobResult === "success") {
              conclusion = "success";
              title = "PASS — config evals battery held the baseline";
            } else if (jobResult === "skipped" && pathsResult !== "success") {
              // The battery only skips inside this job's `if` when
              // changed-paths failed (gated output empty ⇒ battery's
              // `gated == 'true'` condition was false). We could not
              // determine whether the PR touches gated paths ⇒ fail closed.
              title = `FAIL — gated-path detection failed (changed-paths: ${pathsResult}), battery skipped`;
              summaryMd = summaryMd ||
                "The changed-paths job could not list this PR's files, so the " +
                "gate cannot prove the PR touches no gated path. The gate fails " +
                "closed: re-run the workflow (transient API failure) or investigate " +
                "the changed-paths job log.";
            } else if (!results) {
              // Infra death before results existed — ERRORED, not a score FAIL.
              // Conclusion stays "failure" (fail closed; never neutral).
              title = `ERRORED — no battery results (battery job: ${jobResult})`;
              summaryMd = summaryMd ||
                `The battery job finished with status \`${jobResult}\` and produced no ` +
                "results artifact (crash, timeout, or cancellation before scoring " +
                "completed). The gate fails closed: re-run the job or fix the battery.";
            } else if (results.verdict === "ERRORED") {
              // Battery ran but infra/timeout corrupted cases — distinct from a
              // score-based FAIL so operators re-run instead of chasing scores.
              title = `ERRORED — infra/timeout during battery (battery job: ${jobResult})`;
            } else {
              title = `FAIL — battery verdict ${results.verdict} (battery job: ${jobResult})`;
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "config-evals-gate",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion,
              output: {
                title,
                summary: (summaryMd || title).slice(0, 60000),
              },
            });

  # CRED-2: fork PRs cannot assume the OIDC role, so the battery cannot run —
  # and on fork pull_request events GITHUB_TOKEN is read-only (job-level
  # `checks: write` is not honored), so this workflow cannot publish ANY
  # `config-evals-gate` check for them either. The gate is same-repo only.
  # This job exists purely to say so VISIBLY: a plain failing job (exit 1, no
  # checks.create attempt — it would 403) on every gated-or-undetermined fork
  # PR. The actual merge block is the required check's ABSENCE: branch
  # protection holds the PR at "Expected — waiting" (fail closed).
  # `gated != 'false'` for the same fail-closed reason as publish: a fork PR
  # whose path detection failed must still fail visibly. No checkout: zero PR
  # code executes.
  fork-guard:
    needs: changed-paths
    if: always() && needs.changed-paths.outputs.gated != 'false' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail visibly — fork PRs cannot be gated
        run: |
          echo "::error::This PR touches gated config paths but comes from a fork. The config evals gate is same-repo only: fork pull_request runs get a read-only GITHUB_TOKEN, so the required 'config-evals-gate' check run cannot be published from this workflow (and the OIDC eval role cannot be assumed to run the battery). The absent required check blocks the merge. To gate this contribution, a maintainer must push the branch to the base repository and open a same-repo PR."
          exit 1

  # Companion to fork-guard for UNGATED fork PRs: nothing needs scoring, but
  # the required `config-evals-gate` check still cannot be published (read-only
  # token), so the PR still cannot merge as-is. This job succeeds (exit 0) and
  # explains the maintainer workflow instead of failing noisily. No checkout:
  # zero PR code executes.
  fork-notice:
    needs: changed-paths
    if: needs.changed-paths.outputs.gated == 'false' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain — no check can be published for fork PRs
        run: |
          echo "::notice::This fork PR touches no gated config paths, but the 'config-evals-gate' check run cannot be published for fork PRs (GITHUB_TOKEN is read-only on fork pull_request events), so branch protection will hold the PR at 'Expected — waiting'. A maintainer must push the branch to the base repository and open a same-repo PR to get the required check (it would publish as SKIPPED success)."

  # Neutral-publisher (C1 / FR-2.6): a PR that touches NO gated path still gets
  # a completed `config-evals-gate` check — an explicit SUCCESS — so the check
  # can be marked REQUIRED in branch protection without blocking unrelated PRs
  # on "Expected — waiting". SAME-REPO only (CRED-2/TEAM-3425): on fork PRs the
  # read-only GITHUB_TOKEN makes checks.create 403, so attempting it here would
  # just fail — ungated fork PRs get fork-notice instead. No checkout: zero PR
  # code executes.
  skip-publish:
    needs: changed-paths
    if: needs.changed-paths.outputs.gated == 'false' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Publish skipped-success check
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "config-evals-gate",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "SKIPPED — no gated paths changed",
                summary: "This PR touches none of the gated paths (prompts, workflow/agent " +
                  "config, blueprints, eval battery, or the gate workflows themselves), so " +
                  "the config evals battery did not run. This success check exists so " +
                  "`config-evals-gate` can be a required status check in branch protection " +
                  "without blocking unrelated PRs: every PR gets exactly one completed " +
                  "check — PASS/FAIL from the battery when gated paths change, this " +
                  "SKIPPED success when they don't.",
              },
            });
