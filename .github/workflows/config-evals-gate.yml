# Config Evals Gate (FR-4/FR-6) — PR gate for prompt/config/blueprint changes.
#
# Always-run design (C1 / FR-2.6): the workflow triggers on EVERY pull_request
# (no `paths:` filter) and computes the gated-path filter INSIDE the workflow
# (changed-paths job). A trigger-level `paths:` filter would mean PRs touching
# no gated path get NO `config-evals-gate` check run at all — making the check
# unusable as a required status check in branch protection (every unrelated PR
# would hang on "Expected — waiting"). Instead, the skip-publish job publishes
# an explicit SUCCESS check ("SKIPPED — no gated paths changed") for ungated
# PRs, so the check is always present and can safely be marked required.
# Path detection FAILS CLOSED: if changed-paths cannot list the PR's files,
# the PR is treated as gated (publish uses `gated != 'false'`, and the fork
# publisher workflow fails closed the same way).
#
# Hardened per the TEAM-3066 security review:
#   HERM-1  The job that executes PR code (battery) has NO checks:write and no
#           on-disk git credential (persist-credentials: false + preflight
#           assertion). Check publication happens in a separate job (publish)
#           that checks out nothing and executes zero PR code.
#   CRED-2  Fork PRs never receive credentials and never run, and no job in THIS
#           workflow tries to publish a check for them: for `pull_request` runs
#           from a fork, GITHUB_TOKEN is read-only and a job-level
#           `permissions: checks: write` request is silently NOT granted, so
#           `checks.create` would 403 and the required check would simply be
#           absent. The fork check is published instead by
#           `.github/workflows/config-evals-gate-fork-publish.yml`, a
#           `workflow_run` workflow that runs the DEFAULT-branch definition with
#           a real write token, executes zero fork code, and RECOMPUTES
#           gatedness from the API (never trusting this run's artifacts).
#           Gated fork PR ⇒ explicit FAILING check; ungated fork PR ⇒ the same
#           SKIPPED success this workflow's skip-publish posts for same-repo PRs.
#   CRED-3  The OIDC role session is named gha-<run_id>-<actor> so every
#           Bedrock/S3 call in CloudTrail attributes to a specific run + human.
#
# Trigger is `pull_request` — NEVER `pull_request_target`, which would run
# PR-controlled code with base-repo credentials (HERM-1).
#
# Trust boundary — HARNESS FROM BASE, CONFIG FROM HEAD (TEAM-3425):
# the battery job's working tree is the PR's BASE revision
# (`pull_request.base.sha`), and only the candidate-input paths the battery
# scores (prompts, workflow-manager, blueprints, src/config/{workflows,agents}
# .json) are overlaid from `pull_request.head.sha`. Everything that EXECUTES —
# `evals/battery/**`, `package.json`/`package-lock.json` (so `npm ci` installs
# the base lockfile's deps), and this workflow's own logic — comes from base.
# Otherwise a same-repo PR could replace run-battery.mjs with `echo
# '{"verdict":"PASS"}'` and self-approve, because the publish job trusts the
# battery artifact. FR-2.2 (score PR-head CONFIG) still holds: the config under
# test is head's; only the referee is base's.
#   Consequence: a PR that edits `evals/battery/**` is still GATED — changed-paths
#   flags it and the battery runs — but it runs the BASE harness, so the PR's own
#   harness changes have no effect on its own gate run (the same merge-lag the
#   base-ref gating knobs already have, see the README). That includes case
#   files: a case ADDED by the PR is not in the tree, so it does not run in that
#   PR either. New harness code first executes after merge, in
#   config-evals-baseline.yml's post-merge baseline run and in every subsequent
#   PR's gate run. Harness diffs are reviewed by reading them, not by trusting a
#   green check the diff itself produced.
name: Config Evals Gate

on:
  pull_request:

concurrency:
  group: config-evals-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: nothing at the workflow level; each job asks for exactly
# what it needs.
permissions: {}

jobs:
  # Decides whether this PR touches any gated path. Runs for ALL PRs — same-repo
  # AND forks — which is safe because it executes zero PR code (github-script
  # against the API only, no checkout). The path list must stay EXACTLY in sync
  # with config-evals-baseline.yml's push paths, plus the three gate workflow
  # files themselves: a PR that edits the gate must run the gate (fail closed).
  changed-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      gated: ${{ steps.filter.outputs.gated }}
    steps:
      - name: Detect gated-path changes
        id: filter
        uses: actions/github-script@v7
        with:
          script: |
            // Keep in sync with config-evals-baseline.yml `on.push.paths` AND
            // with the copy of this list in config-evals-gate-fork-publish.yml
            // (that workflow recomputes gatedness for fork PRs and must reach
            // the same verdict this job would).
            const gatedPrefixes = [
              "deploy/runtime-agent/prompts/", // deploy/runtime-agent/prompts/**
              "deploy/workflow-manager/",      // deploy/workflow-manager/** (TEAM-3295: whole dir, not just system-prompt.md)
              "blueprints/",                   // blueprints/**
              "evals/battery/",                // evals/battery/**
            ];
            const gatedFiles = [
              "src/config/workflows.json",
              "src/config/agents.json",
              // The gate workflows themselves: changes to the gate run the gate.
              ".github/workflows/config-evals-gate.yml",
              ".github/workflows/config-evals-baseline.yml",
              ".github/workflows/config-evals-gate-fork-publish.yml",
            ];
            const isGated = (name) =>
              typeof name === "string" &&
              (gatedFiles.includes(name) ||
                gatedPrefixes.some((p) => name.startsWith(p)));

            // FAIL CLOSED: no try/catch — if listing files throws, this job
            // fails, the `gated` output stays empty, and publish
            // (`gated != 'false'`) treats the PR as gated.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // A rename out of a gated path changes gated content too, so
            // previous_filename counts as well (matches git-diff semantics).
            const hits = files
              .filter((f) => isGated(f.filename) || isGated(f.previous_filename))
              .map((f) => f.filename);
            const gated = hits.length > 0;
            core.info(
              gated
                ? `Gated paths changed (${hits.length}):\n${hits.join("\n")}`
                : `No gated paths among ${files.length} changed file(s).`
            );
            core.setOutput("gated", gated ? "true" : "false");

  # The ONLY job that runs the battery. It cannot publish checks (HERM-1) and
  # only runs for same-repo branches (CRED-2 — fork PRs get their check from
  # config-evals-gate-fork-publish.yml instead).
  #
  # It executes NO code from the PR head: the working tree is the base revision
  # and only the candidate-config paths are overlaid from head (see the trust
  # boundary note in the header). PR-authored *config* is still fully in play —
  # prompts, blueprints and agent/workflow JSON are exactly what the PR proposes,
  # which is the whole point of the gate — so the credential isolation below
  # (persist-credentials: false, no checks:write, OIDC role scoped to Bedrock)
  # stays exactly as strict as when the harness itself came from the PR.
  battery:
    needs: changed-paths
    if: needs.changed-paths.outputs.gated == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A hung battery hits this timeout ⇒ failed job ⇒ publish reports a FAILED
    # check. Never neutral, never absent.
    timeout-minutes: 15
    permissions:
      contents: read # checkout only
      id-token: write # OIDC role assumption
      # NO checks:write here (HERM-1): PR code must not be able to green-light itself.
    environment: config-evals
    steps:
      # The TRUSTED working tree: the PR's base revision. This is the harness
      # (evals/battery/**), the dependency lockfile npm ci installs from, and the
      # config the overlay step below selectively replaces. `base.sha` — the
      # exact commit the PR is diffed against — not `github.base_ref`, whose tip
      # can move mid-run.
      - name: Checkout trusted base revision (harness + baseline config)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # HERM-1: leave no token on disk for the battery to exfiltrate.
          persist-credentials: false

      # PR-head tree as DATA ONLY, into a subdirectory. Nothing here is ever
      # executed, imported, or installed from; the next step copies an allowlist
      # of config paths out of it and deletes it.
      - name: Checkout PR head into pr-head/ (data only, never executed)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Assert no on-disk git credential (HERM-1)
        run: |
          set -euo pipefail
          extraheader="$(git config --get http.https://github.com/.extraheader || true)"
          if [ -n "$extraheader" ]; then
            echo "::error::git http extraheader credential persisted despite persist-credentials:false — refusing to run PR code"
            exit 1
          fi
          if grep -qi authorization .git/config; then
            echo "::error::authorization header present in .git/config — refusing to run PR code"
            exit 1
          fi

      # Overlay the CANDIDATE CONFIG from the PR head onto the trusted base tree.
      # Plain shell, allowlist-only, no PR-controlled script or action involved.
      # After this step the tree is: base harness + head config, and pr-head/ is
      # gone — so nothing from the PR head is even on disk when node starts,
      # except the config files under test.
      - name: Overlay PR-head candidate config (allowlist only)
        env:
          HEAD_DIR: pr-head
        run: |
          set -euo pipefail
          # EXACTLY the candidate-input paths the battery scores. Keep in sync
          # with changed-paths' gated list MINUS the harness/workflow entries:
          # evals/battery/**, .github/**, package.json and package-lock.json are
          # NEVER copied from the PR head — they execute, so they stay at base.
          candidates=(
            "deploy/runtime-agent/prompts"
            "deploy/workflow-manager"
            "blueprints"
            "src/config/workflows.json"
            "src/config/agents.json"
          )
          for p in "${candidates[@]}"; do
            # rm-then-copy, so adds, modifies, deletes and renames inside the
            # path all land: the base copy is discarded wholesale and only what
            # the PR head actually has is restored. A path the PR deletes stays
            # deleted (and fails preflight, which is the correct verdict).
            rm -rf -- "$p"
            if [ -e "$HEAD_DIR/$p" ]; then
              mkdir -p -- "$(dirname -- "$p")"
              cp -R -- "$HEAD_DIR/$p" "$p"
              echo "overlaid from PR head: $p"
            else
              echo "absent at PR head, removed from the tree: $p"
            fi
          done
          rm -rf -- "$HEAD_DIR"
          echo "Overlay complete — harness is base, config is PR head. Worktree diff vs base:"
          git status --porcelain

      # The commit the harness came from must still be the base revision — and no
      # base-ref fetch is needed because of it: `git show <base.sha>:<path>` (how
      # the runner reads the gating rules) and `git diff <base.sha> -- <path>`
      # (how it sees the candidate changes in the overlaid worktree) both resolve
      # locally. Refuse to spend a cent on a harness of unknown provenance.
      - name: Assert the working tree is the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$BASE_SHA" ]; then
            echo "::error::working tree is at $checked_out, expected base revision $BASE_SHA — refusing to run a harness of unknown provenance"
            exit 1
          fi
          if [ -e pr-head ]; then
            echo "::error::pr-head/ still present after the overlay step — refusing to run with PR-head code on disk"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Assume eval-gate role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_GATE_ROLE_ARN }}
          aws-region: us-east-1
          # CRED-3: attributable session name — CloudTrail ties every call
          # made by this job to the exact run and the human who triggered it.
          role-session-name: gha-${{ github.run_id }}-${{ github.actor }}

      - name: Restore flake ledger (best-effort, TEAM-3090)
        # Cross-run verdict history for flake flagging. The ledger only feeds
        # INFORMATIONAL flaky-candidate flags (lib/flake.mjs is report-only;
        # nothing read from it can alter the gate verdict), so a stale or
        # PR-poisoned cache cannot green-light or block a PR. No new
        # permissions: actions/cache needs only the job's existing
        # contents:read. The run_id key never hits, so restore always falls
        # through to the newest prior ledger via the prefix restore-key.
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/flake-ledger.jsonl
          key: config-evals-flake-ledger-${{ github.run_id }}
          restore-keys: |
            config-evals-flake-ledger-

      - name: Run battery
        env:
          # The base SHA itself, not `origin/<branch>`: it is the commit this
          # tree was checked out at, and it cannot drift mid-run the way a
          # branch tip can. Gate-mode rule resolution (`git show
          # <base-ref>:evals/battery/...`) therefore reads the same revision the
          # harness came from, and new-case detection diffs the overlaid
          # worktree against it.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The config revision under test — reported in the check summary and
          # battery-results.json. Without it the runner would stamp results with
          # `git rev-parse HEAD`, i.e. the base harness sha, which is not what
          # was scored.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # run-battery.mjs writes check-summary.md next to --results and exits
        # non-zero on a FAIL verdict, so a red battery job ⇔ red gate.
        run: node evals/battery/run-battery.mjs --results "$RUNNER_TEMP/battery-results.json" --base-ref "$BASE_SHA" --config-sha "$HEAD_SHA" --flake-ledger "$RUNNER_TEMP/flake-ledger.jsonl"

      - name: Save flake ledger (best-effort, TEAM-3090)
        # Unique per-run key so the save never conflicts; the next run's
        # restore picks the newest via the prefix restore-key. always():
        # a FAILing run's verdict is exactly what the flip counter needs.
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/flake-ledger.jsonl
          key: config-evals-flake-ledger-${{ github.run_id }}

      - name: Upload results
        # always(): the publish job needs the artifact even (especially) when
        # the battery failed — verdict + summary end up in the check run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-results
          path: |
            ${{ runner.temp }}/battery-results.json
            ${{ runner.temp }}/check-summary.md
            ${{ runner.temp }}/flake-ledger.jsonl
          if-no-files-found: ignore

  # Publishes the `config-evals-gate` check run. Runs NO PR code — no checkout
  # at all (HERM-1 split): its only inputs are the artifact and job status.
  # `gated != 'false'` (not `== 'true'`): if changed-paths itself failed, its
  # output is empty and the PR must still get a check — a FAILING one (fail
  # closed), since we could not prove the PR touches no gated path.
  publish:
    needs: [changed-paths, battery]
    if: always() && needs.changed-paths.outputs.gated != 'false' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write # the ONLY permission — and the only job that has it
    steps:
      - uses: actions/download-artifact@v4
        # continue-on-error: a battery job that died before uploading (crash,
        # timeout, cancellation) must still yield a FAILING check below.
        continue-on-error: true
        with:
          name: battery-results
          path: ${{ runner.temp }}/battery-results

      - name: Publish check run (fail closed)
        uses: actions/github-script@v7
        env:
          BATTERY_JOB_RESULT: ${{ needs.battery.result }}
          CHANGED_PATHS_RESULT: ${{ needs.changed-paths.result }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const dir = path.join(process.env.RUNNER_TEMP, "battery-results");
            const jobResult = process.env.BATTERY_JOB_RESULT;
            const pathsResult = process.env.CHANGED_PATHS_RESULT;

            let results = null;
            try {
              results = JSON.parse(fs.readFileSync(path.join(dir, "battery-results.json"), "utf8"));
            } catch { /* missing/unparseable artifact ⇒ stays null ⇒ failure */ }
            let summaryMd = "";
            try {
              summaryMd = fs.readFileSync(path.join(dir, "check-summary.md"), "utf8");
            } catch { /* optional */ }

            // Fail closed in EVERY branch: success requires the artifact to
            // exist, the verdict to be PASS, and the battery job to have
            // succeeded. Missing artifact, FAIL verdict, job failure,
            // cancellation, timeout, and a failed path detection all land on
            // "failure".
            let conclusion = "failure";
            let title;
            if (results && results.verdict === "PASS" && jobResult === "success") {
              conclusion = "success";
              title = "PASS — config evals battery held the baseline";
            } else if (jobResult === "skipped" && pathsResult !== "success") {
              // The battery only skips inside this job's `if` when
              // changed-paths failed (gated output empty ⇒ battery's
              // `gated == 'true'` condition was false). We could not
              // determine whether the PR touches gated paths ⇒ fail closed.
              title = `FAIL — gated-path detection failed (changed-paths: ${pathsResult}), battery skipped`;
              summaryMd = summaryMd ||
                "The changed-paths job could not list this PR's files, so the " +
                "gate cannot prove the PR touches no gated path. The gate fails " +
                "closed: re-run the workflow (transient API failure) or investigate " +
                "the changed-paths job log.";
            } else if (!results) {
              // Infra death before results existed — ERRORED, not a score FAIL.
              // Conclusion stays "failure" (fail closed; never neutral).
              title = `ERRORED — no battery results (battery job: ${jobResult})`;
              summaryMd = summaryMd ||
                `The battery job finished with status \`${jobResult}\` and produced no ` +
                "results artifact (crash, timeout, or cancellation before scoring " +
                "completed). The gate fails closed: re-run the job or fix the battery.";
            } else if (results.verdict === "ERRORED") {
              // Battery ran but infra/timeout corrupted cases — distinct from a
              // score-based FAIL so operators re-run instead of chasing scores.
              title = `ERRORED — infra/timeout during battery (battery job: ${jobResult})`;
            } else {
              title = `FAIL — battery verdict ${results.verdict} (battery job: ${jobResult})`;
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "config-evals-gate",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion,
              output: {
                title,
                summary: (summaryMd || title).slice(0, 60000),
              },
            });

  # CRED-2: fork PRs cannot assume the OIDC role, so the battery cannot run —
  # and this workflow CANNOT publish their check either. On a `pull_request` run
  # from a fork the GITHUB_TOKEN is read-only no matter what a job's
  # `permissions:` block asks for, so any `checks.create` here 403s and the
  # required check ends up absent (the exact hole an explicit failing check was
  # meant to close). The check is published out-of-band instead, by
  # `.github/workflows/config-evals-gate-fork-publish.yml` (`workflow_run`, runs
  # the default-branch definition with a genuine `checks: write` token, executes
  # zero fork code, recomputes gatedness from the API). This job requests NO
  # permissions and only leaves a breadcrumb in the fork's own run log, so a
  # contributor looking at their run learns where the check comes from.
  fork-notice:
    needs: changed-paths
    if: always() && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain fork handling
        env:
          GATED: ${{ needs.changed-paths.outputs.gated }}
        run: |
          set -euo pipefail
          echo "Fork PR: the config evals battery does not run (no credentials are ever"
          echo "issued to fork code), and this run cannot publish a check run either —"
          echo "GITHUB_TOKEN is read-only for pull_request runs from forks."
          echo
          echo "The 'config-evals-gate' check for this PR is published by the"
          echo "'Config Evals Gate Fork Publisher' workflow, which starts when this run"
          echo "completes and recomputes the gated-path decision from the API:"
          echo "  gated paths changed  -> FAILING check; a maintainer must push this branch"
          echo "                          to the base repository to gate it."
          echo "  no gated paths       -> SUCCESS check (SKIPPED — nothing to gate)."
          echo
          echo "changed-paths gated output for this run: '${GATED}' (empty = detection failed, treated as gated)."

  # Neutral-publisher (C1 / FR-2.6): a PR that touches NO gated path still gets
  # a completed `config-evals-gate` check — an explicit SUCCESS — so the check
  # can be marked REQUIRED in branch protection without blocking unrelated PRs
  # on "Expected — waiting". No checkout: zero PR code executes.
  # SAME-REPO ONLY (CRED-2): for fork PRs this job's `checks: write` request is
  # not honored and `checks.create` would 403, failing the job instead of
  # publishing anything. Ungated FORK PRs get the identical SKIPPED success from
  # the fork publisher workflow.
  skip-publish:
    needs: changed-paths
    if: needs.changed-paths.outputs.gated == 'false' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Publish skipped-success check
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "config-evals-gate",
              head_sha: context.payload.pull_request.head.sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "SKIPPED — no gated paths changed",
                summary: "This PR touches none of the gated paths (prompts, workflow/agent " +
                  "config, blueprints, eval battery, or the gate workflows themselves), so " +
                  "the config evals battery did not run. This success check exists so " +
                  "`config-evals-gate` can be a required status check in branch protection " +
                  "without blocking unrelated PRs: every PR gets exactly one completed " +
                  "check — PASS/FAIL from the battery when gated paths change, this " +
                  "SKIPPED success when they don't.",
              },
            });
