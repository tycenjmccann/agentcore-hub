name: CI

on:
  push:
    branches: [main, clean-main]
  pull_request:

jobs:
  build:
    name: Lint, Typecheck, Unit, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (hermetic — no AWS)
        run: npm run test:unit

      # The cost-report Lambda's pricing reducer (addUsage) is exercised by a
      # node:test suite next to the code (TEAM-3954). It's a standalone
      # `node --test` run, not part of the vitest include list, so it needs its
      # own step to gate PRs. index.mjs's @aws-sdk imports resolve from the root
      # node_modules that `npm ci` just installed (client-cost-explorer is a
      # devDependency for exactly this reason).
      - name: Cost-report lambda unit tests (node --test)
        run: node --test lambda/cost-report

      # R2 (docs/race-condition-study.md): the workflows table may only be
      # written through lambda/orchestrator/workflow-store.mjs — ad-hoc writes
      # are the read-modify-write clobber class behind most workflow races.
      - name: Workflow-table write guard
        run: ./scripts/check-workflow-writes.sh

      # Every lambda/* and deploy/* surface must be in the pipeline's deploy
      # manifest (deploy/pipeline/surfaces.json) — or explicitly handoff/excluded —
      # otherwise merged code never reaches prod and drifts behind main.
      - name: Deploy-surface manifest guard
        run: ./scripts/check-deploy-surfaces.sh

      - name: Build
        run: npm run build

  # The runtime agent is Python and ships outside the Next.js build, so its
  # telemetry instrumentation was never covered by any job above. That gap is how
  # a missing TracerProvider reached prod and turned every eval batch into a
  # silent 0/10. These tests use a stub model and an in-memory span exporter —
  # no AWS, no credentials, no network.
  python-telemetry-tests:
    name: Python unit tests (hermetic — no AWS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: deploy/runtime-agent/tests/requirements-test.txt

      # Deliberately not deploy/runtime-agent/requirements.txt: these are the
      # slim test deps (Strands + the OTel SDK), not the full runtime.
      - name: Install test dependencies
        run: pip install -r deploy/runtime-agent/tests/requirements-test.txt

      # tests/ plus the TEAM-3096 unittest suites that live next to the code
      # they extract from (test_telemetry_init.py execs main.py's init block,
      # test_build_env_vars.py imports deploy-one-robust.py).
      #
      # TEAM-3758: the workflow-manager toolkit tests run here too. Both are
      # hermetic under this job's slim deps (no boto3): test_metrics imports only
      # the stdlib-pure compute_metrics, and test_save_analysis stubs boto3 in
      # sys.modules before importing save_analysis. This finally executes
      # test_metrics.py — which had no CI job at all — and the new
      # test_save_analysis.py (AC-D2.5 RunOutcome mapping).
      - name: Python unit tests (hermetic — no AWS)
        run: >
          pytest -q
          deploy/runtime-agent/tests
          deploy/runtime-agent/test_telemetry_init.py
          deploy/runtime-agent/test_build_env_vars.py
          deploy/workflow-manager/toolkit
          deploy/pipeline/test_ecs_primary_container.py
          deploy/pipeline/test_plan_surfaces.py

  cloud-code-ui:
    name: Cloud Code UI (mocked, no AWS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Every backend call in this spec is intercepted with page.route, so a plain
      # `next start` with zero credentials serves it. Boot, wait for ready, test.
      # Detach + redirect output: a bare `&` leaves next start holding the step's
      # stdout/stderr pipe open, so the runner's output reader can block on EOF and
      # hang the step until the job timeout. nohup + file redirect frees the pipe.
      - name: Start server
        run: nohup npm run start -- -p 3737 > /tmp/next-server.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3737/cloud-code; then
              echo "server up"; exit 0
            fi
            sleep 2
          done
          echo "server did not come up"; exit 1

      # --trace retain-on-failure overrides the config's on-first-retry: this job
      # runs no retries, so on-first-retry would never capture a trace on a
      # first-attempt failure — the artifact upload below would have nothing.
      - name: Cloud Code UI regression suite
        run: npm run test:cloud-code -- --trace retain-on-failure
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3737

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-code-ui-traces
          path: test-results/
          retention-days: 7
