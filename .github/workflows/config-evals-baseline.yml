# Config Evals Baseline (FR-3) — regenerates evals/battery/baseline.json ONLY
# on merge to main (plus manual dispatch). PR runs never write the baseline;
# run-battery.mjs refuses --out outside --baseline-mode by construction.
#
# Security posture mirrors config-evals-gate.yml: OIDC only, no persisted git
# credential, attributable role session name (CRED-3).
name: Config Evals Baseline

on:
  push:
    branches: [main]
    paths:
      - "deploy/runtime-agent/prompts/**"
      - "deploy/workflow-manager/**"
      - "src/config/workflows.json"
      - "src/config/agents.json"
      - "blueprints/**"
      - "evals/battery/**"
  workflow_dispatch:

# Serialize baseline runs; never cancel one mid-write — the supersession +
# ancestry checks in the commit step (run on BOTH the conflict and the
# clean-rebase path, C3) handle a queued run landing after a newer one.
concurrency:
  group: config-evals-baseline
  cancel-in-progress: false

permissions: {}

jobs:
  baseline:
    runs-on: ubuntu-latest
    # ~3× the gate battery's budget: --repeat 3 runs every case three times to
    # stabilize per-evaluator means.
    timeout-minutes: 30
    permissions:
      contents: write # commit-back of baseline.json
      id-token: write # OIDC role assumption
    environment: config-evals
    steps:
      - uses: actions/checkout@v4
        with:
          # No on-disk credential; the push step below injects a token
          # explicitly and only into its own environment.
          persist-credentials: false
          # Full history: the supersession check needs ancestry
          # (merge-base --is-ancestor) and the rebase+push needs real parents.
          fetch-depth: 0

      - name: Assert no on-disk git credential
        run: |
          set -euo pipefail
          extraheader="$(git config --get http.https://github.com/.extraheader || true)"
          if [ -n "$extraheader" ]; then
            echo "::error::git http extraheader credential persisted despite persist-credentials:false"
            exit 1
          fi
          if grep -qi authorization .git/config; then
            echo "::error::authorization header present in .git/config"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Assume eval-gate role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_GATE_ROLE_ARN }}
          aws-region: us-east-1
          # CRED-3: attributable session name for CloudTrail.
          role-session-name: gha-baseline-${{ github.run_id }}

      - name: Regenerate baseline (repeat 3)
        run: node evals/battery/run-battery.mjs --baseline-mode --repeat 3 --out evals/battery/baseline.json

      # C3 provenance: source_commit is the sha the baseline was GENERATED
      # FROM (run-battery.mjs records `git rev-parse HEAD`). The supersession
      # check below — and any gate/deploy-side drift detection — keys off it,
      # so a mismatch with the checked-out sha means the file lies about its
      # provenance and must never be committed.
      - name: Assert baseline provenance (source_commit == GITHUB_SHA)
        run: |
          set -euo pipefail
          source_commit="$(jq -r '.source_commit // empty' evals/battery/baseline.json)"
          if [ "$source_commit" != "$GITHUB_SHA" ]; then
            echo "::error::baseline.json source_commit '$source_commit' != checked-out sha '$GITHUB_SHA' — provenance mismatch, refusing to commit"
            exit 1
          fi

      # SECRET-4: the push uses the workflow-scoped ephemeral GITHUB_TOKEN,
      # injected only into this step's env (persist-credentials is false, so
      # nothing lives on disk). OPS PREREQUISITE: branch protection on main
      # must allow pushes from the github-actions[bot] app (or swap this for a
      # narrowly-scoped deploy key) — otherwise this step fails with a 403 and
      # the baseline must be committed manually.
      - name: Commit baseline back to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # C3: shared supersession test, used by BOTH the conflict path and
          # the clean-rebase path. True when origin/main already carries a
          # baseline generated from a descendant of our commit — ours is
          # stale and must be discarded. Sets $incoming_source for messages.
          superseded_by_origin() {
            incoming_source="$(git show origin/main:evals/battery/baseline.json | jq -r '.source_commit // empty' || true)"
            [ -n "$incoming_source" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$incoming_source"
          }

          if git diff --quiet -- evals/battery/baseline.json; then
            echo "baseline unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/battery/baseline.json
          git commit -m "chore: regenerate evals baseline for ${GITHUB_SHA} [skip ci]"
          if ! git pull --rebase origin main; then
            # Conflict: someone else landed a baseline while we ran. If theirs
            # was generated from a DESCENDANT of our commit, ours is stale —
            # discard it and exit green (superseded, not an error).
            if superseded_by_origin; then
              echo "::notice::superseded — origin/main already carries a baseline generated from $incoming_source, a descendant of $GITHUB_SHA. Discarding this run's baseline."
              git rebase --abort || true
              exit 0
            fi
            echo "::error::rebase conflict on baseline.json not explained by a newer (descendant) baseline — resolve manually"
            exit 1
          fi

          # C3: a CLEAN rebase proves nothing about freshness — a newer gated
          # commit that didn't touch baseline.json rebases cleanly, and its
          # (queued) baseline run can be lost to cancellation or runner
          # outage. Re-fetch the true tip and run the SAME supersession +
          # ancestry validation before pushing.
          git fetch origin main
          if superseded_by_origin; then
            echo "::notice::superseded — origin/main already carries a baseline generated from $incoming_source, a descendant of $GITHUB_SHA. Discarding this run's baseline."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is no longer an ancestor of origin/main (history rewrite, or dispatch on a stale ref) — refusing to push a baseline generated from it"
            exit 1
          fi
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            # Not fatal by itself: no newer-descendant baseline exists (checked
            # above), so ours is the best available. The queued baseline run
            # for the newer commit — or a manual workflow_dispatch — will
            # regenerate from the tip.
            echo "::warning::main advanced past $GITHUB_SHA while this baseline was generated; pushing anyway since origin/main carries no baseline from a newer commit. The newer commit's baseline run (or a manual workflow_dispatch) will supersede this one."
          fi
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
